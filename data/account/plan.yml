schema_version: 1
base_currency: USD
default_monthly_contribution:
  amount: 888
  currency: USD
  status: planned_not_confirmed_cash
investment_horizon: multi_decade
portfolio_type: satellite_only
primary_goal: asymmetric_multi_decade_compounding
execution_preferences:
  trade_execution: user_executes_manually
  fractional_shares_allowed: unknown_until_user_confirms_broker_capability
  default_order_type: unknown_until_monthly_decision
  cash_buffer_policy: do_not_force_deployment_keep_cash_or_liquidity_reserve_when_no_target_passes_gates
liquidity_reserve:
  status: allowed_under_policy_v1.2_after_user_approval
  default_symbol: SGOV
  role: cash_management_only_not_return_seeking_allocation
  deployment_rule: use_only_for_idle_cash_when_no_return_seeking_candidate_passes_mission_evidence_and_entry_gates
  liquidation_rule: sell_some_or_all_reserve_when_needed_for_approved_high_conviction_return_seeking_purchase_and_follow_broker_settlement_rules
  sizing_rule: monthly_contribution_is_not_a_cap_evaluate_total_confirmed_deployable_liquidity_for_rare_high_conviction_opportunities
  schwab_international_note: unsettled_sale_proceeds_may_be_available_to_trade_but_avoid_selling_the_new_purchase_before_reserve_sale_settles_unless_broker_confirms_no_violation
mission_accountability:
  policy_version: v1.2
  liquidity_option_weight_definition: confirmed_cash_plus_confirmed_liquidity_reserve_market_value_divided_by_latest_reliable_research_nav
  high_liquidity_option_threshold_pct: 60
  pressure_review_after_days: 45
  opportunity_set_reset_after_days: 90
  strategy_review_after_days: 180
  clock_reset_rule: only_after_material_liquidity_option_weight_reduction_or_source_backed_mission_relevant_deployment_with_credible_path_to_scale
  symbolic_trade_resets_clock: false
  thresholds_create_orders: false
recordkeeping:
  ledger_is_append_only: true
  update_only_after_broker_confirmation: true
  corrections_are_new_events: true
