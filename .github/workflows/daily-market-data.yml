name: Refresh Daily Market Data

on:
  schedule:
    - cron: "30 3 * * 2-6"
  workflow_dispatch:
    inputs:
      as_of:
        description: Optional market date upper bound in YYYY-MM-DD format.
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: invest-daily-market-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh close prices
        run: node scripts/refresh-market-data.mjs
        env:
          MARKET_DATA_AS_OF: ${{ github.event.inputs.as_of }}
      - run: npm run verify
      - name: Commit refreshed data
        id: commit
        run: |
          if git diff --quiet -- data/account/equity_curve.csv data/market/watchlist_prices.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No market data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/account/equity_curve.csv data/market/watchlist_prices.csv
          git commit -m "data: refresh daily close prices"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true'
