notes: >-
  Ready means the repository-public research state has no unresolved repository-work or publicly reachable evidence blocker. User-only broker facts and final execution instructions are listed as future execution prerequisites rather than making the repository not ready. Material incubating candidates must also have dashboard-facing research-only coverage, not just a hidden note. Discovery lane readiness means the current lane map has been reviewed, and watchlist readiness means every non-removed watchlist row has a current cycle review rather than relying on stale priority or status memory. The 2026-06-18 run confirmed that ASTS launch success strengthened only a tiny private add, while SPCX Cursor evidence raised strategic opportunity cost but worsened public common-stock entry. The later confirmed USD 888 deposit supported scaling the private RKLB and ASTS staged add without fully deploying cash. The 2026-06-22 broker-confirmed fills are now normalized as historical account records but remain local and unpublished until the publication policy allows release.
