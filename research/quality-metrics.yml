notes: >-
  Ready means the repository-public research state has no unresolved repository-work or publicly reachable evidence blocker. User-only broker facts and final execution instructions are listed as future execution prerequisites rather than making the repository not ready. Material incubating candidates must also have dashboard-facing research-only coverage, not just a hidden note. Discovery lane readiness means the current lane map has been reviewed, and watchlist readiness means every non-removed watchlist row has a current cycle review rather than relying on stale priority or status memory. The 2026-06-12 run adds the durable process rule that a newly public former private opportunity such as SPCX must be reconciled into the lane map, security master, readiness index, filing review, valuation state, watchlist review, and buy-zone records before it can affect allocation. Exact actionable order details remain private while still actionable under the publication policy.
