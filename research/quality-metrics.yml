notes: >-
  Ready means the repository-public research state has no unresolved repository-work or publicly reachable evidence blocker. User-only broker facts and final execution instructions are listed as future execution prerequisites rather than making the repository not ready. Material incubating candidates must also have dashboard-facing research-only coverage, not just a hidden note. Discovery lane readiness means the current lane map has been reviewed, and watchlist readiness means every non-removed watchlist row has a current cycle review rather than relying on stale priority or status memory. The 2026-06-05 rerun reinforces two process lessons: do not raise a buy cap merely because a best-ranked company trades above it, and keep same-day exact order details out of public repository records until the publication embargo clears. Ownership forms such as Form 4 and Form 144 remain outside the event-filing scan and need direct SEC submissions checks for buy-zone names.
