  latest_constitutional_audit_path: research/process/2026-07-28-article-one-constitutional-audit.md
  current_conclusion: No new action is active. MDA remains the strongest candidate, but its prior owner order state must be resolved before any new quantity is considered; no trade or fill is inferred. GILT LEU and IONQ remain at zero after current evidence. The separate 45-day mission-pressure review remains due on 2026-08-22 unless a mission-relevant deployment is broker-confirmed first.
