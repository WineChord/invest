    - broker order preview for commissions, fees, fractional-share support, settlement constraints, and final user execution instruction before any real order
    - private order-entry constraints remain outside the committed public record until the publication embargo clears
    - do not rely on the committed public record as executable order guidance
    - do not buy LEU without a fresh promotion review despite the DOE HALEU contract
    - do not buy SPCX without a fresh post-IPO promotion review covering valuation, float, lockup, governance, capital structure, notes, and xAI/X exposure
    - SGOV broker ETF eligibility, fee, fractional-share, and settlement treatment before any future reserve purchase
