  zero_vs_starter_result: Zero narrowly wins only through the August 5–6 evidence window because the near-dated filings can change the sign of LEU contract economics or GILT post-transaction shareholder value; the same zero may not roll forward without a fresh adjudication.
  zero_exposure_reason_code: decision_critical_economics_gap
  decision_critical_missing_evidence: LEU fixed-price contract milestones, cost-sharing, termination protection, TENEX substitution and expansion funding; GILT audited Q2 cash conversion, transaction status, final purchase-price and working-capital adjustments, and post-close liquidity.
  why_risk_sizing_cannot_absorb_uncertainty: A smaller position bounds dollars lost but cannot repair an unknown contract value sign or an unproved post-transaction per-share denominator; both inputs are due within one week.
  cash_opportunity_cost: A material event move would create a bounded but real missed-upside cost on the contemplated starter scenarios; that short waiting cost is lower than the value of the near-dated decision-critical evidence. Exact unexpired sizing math is withheld from the public record.
  conjunctive_evidence_and_price_trigger: Reassess LEU after the August 5 filing only if contract protection, funding and TENEX replacement preserve per-share value; reassess GILT only if Q2 cash conversion, transaction terms and post-close liquidity meet the recorded gates. Price alone never authorizes a buy.
