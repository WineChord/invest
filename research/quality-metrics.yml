decision_readiness:
  status: ready
  scope: repository_and_public_observable_information
  can_recommend_buys: true
  reason: Repository-public research coverage is current for a private 2026-06-12 decision after the SPCX listing refresh, active-candidate filing review, market-data refresh, and full watchlist cycle review. SPCX is now public and dashboard-visible but not buy-ready; RKLB and ASTS can receive private staged guidance while exact same-day order details remain outside public repository records until the publication embargo clears. Account records remain unchanged without complete broker confirmation for the 888 USD deposit.
  user_only_execution_prerequisites:
    - broker cash and buying-power confirmation that includes the newly stated 888 USD before any real order
    - complete deposit confirmation fields before mutating repository account records
    - broker order preview for commissions, fees, fractional-share support, settlement constraints, and final user execution instruction before any real order
    - use limit orders only; do not use market orders or chase above the private cap if the next regular-session quote moves
    - exact same-day share and limit details for RKLB and ASTS must remain outside public repository records until the publication embargo clears
    - do not execute if new material issuer evidence, broker restriction, or a large quote gap appears before order entry
    - do not buy SPCX without a fresh post-IPO promotion review covering valuation, float, lockup, governance, and xAI/X exposure
    - SGOV broker ETF eligibility, fee, fractional-share, and settlement treatment before any future reserve purchase
