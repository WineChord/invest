notes: >-
  Ready means the repository-public research state has no unresolved repository-work or publicly reachable evidence blocker. User-only broker facts and final execution instructions are listed as execution prerequisites rather than making the repository not ready. Material incubating candidates must also have dashboard-facing research-only coverage, not just a hidden note. Discovery lane readiness means the current lane map has been reviewed, and watchlist readiness means every non-removed watchlist row has a current cycle review rather than relying on stale priority or status memory. The 2026-06-01 post-discovery pass also records a data-quality lesson: newly public dual-class or transaction issuers may need manual share-count and debt overrides when generic companyfacts fields understate current economic capitalization.
