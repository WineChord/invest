  smallest_prudent_exposure_considered: A public-safe 2 to 4 percent analytical starter range for GILT was tested and would be mission-relevant rather than symbolic; LEU MDA IREN and IONQ also received explicit staged-path reviews.
  zero_vs_starter_result: Zero narrowly wins only through the August 5 evidence window because near-dated filings can resolve GILT transaction economics, LEU contract protection and IONQ post-close capitalization; the same zero may not roll forward without a fresh adjudication.
  zero_exposure_reason_code: decision_critical_economics_gap
  decision_critical_missing_evidence: LEU fixed-price contract milestones, cost-sharing, termination protection, TENEX substitution and expansion funding; GILT audited Q2 cash conversion, transaction status, final consideration and post-close liquidity; IONQ post-close shares, cash use, foundry margins, integration capex and recurring value capture.
  why_risk_sizing_cannot_absorb_uncertainty: A smaller position bounds dollars lost, but it cannot establish whether GILT's apparent denominator survives the transaction, whether LEU's fixed-price contract creates or destroys per-share value, or whether IONQ's acquisition improves rather than dilutes shareholder economics; the key inputs are due within four days.
  cash_opportunity_cost: A GILT starter near the middle of the 2 to 4 percent analytical range would expose about 3.16 percent of NAV; a favorable 20 to 30 percent event gap would cost about 0.63 to 0.95 percent of NAV in missed upside. The four-day information value is judged higher because the evidence can change the post-transaction denominator and scaling path.
  conjunctive_evidence_and_price_trigger: Reassess LEU only if August 5 contract protection, funding and TENEX replacement preserve per-share value; reassess GILT only if cash conversion, transaction terms and post-close liquidity meet the recorded gates; reassess IONQ only if post-close capitalization and foundry economics preserve the integrated-platform thesis. Price alone never authorizes a buy.
  next_evidence_deadline: 2026-08-05
