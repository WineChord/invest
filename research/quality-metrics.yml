notes: >-
  Ready means the repository-public research state has no unresolved repository-work or publicly reachable evidence blocker. User-only broker facts and final execution instructions are listed as future execution prerequisites rather than making the repository not ready. Material incubating candidates must also have dashboard-facing research-only coverage, not just a hidden note. Discovery lane readiness means the current lane map has been reviewed, and watchlist readiness means every non-removed watchlist row has a current cycle review rather than relying on stale priority or status memory. The 2026-06-04 rerun reinforces two process lessons: large price moves beyond a buy-zone stale threshold require a fresh price/freshness rerun before renewing an order, and insider or ownership forms such as Form 4 and Form 144 are outside the event-filing scan and need direct SEC submissions checks for buy-zone names. The repository Yahoo refresh path returned HTTP 429 and produced invalid partial market-file edits during this run; those edits were restored and current quote evidence was recorded separately instead of mutating market databases.
