  strongest_counterfactual: MDA remains the strongest scale-up candidate; GILT is the closest low-denominator challenger, LEU the strongest scarcity expression, APLD the strongest new R1, IREN the strongest existing powered-site challenger and SEI the strongest newly improved operating challenger.
  smallest_prudent_exposure_considered: A three-share MDA add at the USD 34.60 research ceiling was explicitly tested; it would use USD 103.80, raise MDA from 2.13 to about 3.20 percent of NAV and remain inside the starter loss budget.
  zero_vs_starter_result: Existing MDA exposure captures the strengthened operating thesis. Zero incremental shares beat a three-share add only through the Rocket Lab event because Q2 did not prove cash conversion or acquisition economics, the current price offers no margin below the research ceiling and the one-session waiting cost is small relative to the event's portfolio information value.
  zero_exposure_reason_code: other_documented
  decision_critical_missing_evidence: For an MDA scale-up, the missing items are working-capital reversal, final post-offering dilution, acquisition funding and pro-forma leverage, plus the Rocket Lab result that can change the relative value of the largest position. These are target and ranking blockers, not a portfolio-wide veto.
  why_risk_sizing_cannot_absorb_uncertainty: Three additional shares are loss-budget feasible, so risk sizing alone is not the veto. Quantity remains zero because the current price has no entry cushion and existing exposure already bounds the short waiting cost while evidence arrives.
  cash_opportunity_cost: The confirmed MDA starter participates in upside while USD 7334.45 preserves capacity for a post-event scale-up or a superior cross-lane candidate. A 10 percent missed move on three MDA shares is about 0.11 percent of NAV, so the brief wait is measurable but bounded.
  conjunctive_evidence_and_price_trigger: Reconsider MDA only after a fresh tradable price and Rocket Lab comparison, with working-capital recovery, final diluted shares, acquisition funding, pro-forma leverage and no material backlog or margin damage. USD 32.85 and USD 36.32 are review-only triggers, not orders.
  next_evidence_deadline: 2026-08-11
  no_action_streak: 1
  article1_red_team_status: completed_current_v1.3_multi_candidate_starter_challenge
  latest_constitutional_audit_path: research/process/2026-07-28-article-one-constitutional-audit.md
  current_conclusion: Hold RKLB 17, ASTS 11 and MDA 6; add zero and sell zero only through Rocket Lab's August 10 result. MDA remains first for scale review, APLD is the strongest new R1 and no current executable limit exists. The 45-day mission-pressure review remains 2026-09-20 if no later mission-relevant deployment occurs.
