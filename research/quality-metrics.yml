  strongest_counterfactual: MDA is the strongest current configuration candidate after the material Telesat scope expansion; GILT remains the closest low-denominator challenger, LEU the strongest structural bottleneck expression, IREN the strongest powered-site challenger, and IONQ the post-acquisition quantum-platform challenger.
  smallest_prudent_exposure_considered: A private owner-only MDA starter assessment at about 2.35 percent of current research NAV was tested against zero and is mission-relevant rather than symbolic. Exact unexpired quantity, price and timing remain withheld from public artifacts.
  zero_vs_starter_result: The bounded private MDA starter assessment beats zero because mission fit and current primary evidence are strong enough, the position can matter if scaled, and integration, cash-conversion and concentration uncertainty can be bounded by initial size and a short validity window. Zero still wins for GILT, LEU and IONQ only until their scheduled August 5 evidence is reviewed.
  zero_exposure_reason_code: other_documented
  decision_critical_missing_evidence: GILT audited Q2 cash conversion and transaction economics; LEU fixed-price contract protection, funding and TENEX substitution; IONQ post-close capitalization, cash use, foundry margins and integration capex. These gaps block those targets, not the current MDA assessment or the whole opportunity set.
  why_risk_sizing_cannot_absorb_uncertainty: For MDA, ordinary execution, integration and cash-conversion uncertainty can be bounded by a starter size, explicit invalidation and a short validity window. Sizing cannot resolve GILT transaction-denominator risk, LEU contract-sign risk or IONQ post-close unit economics, so those targets remain at zero pending primary evidence.
  cash_opportunity_cost: Remaining entirely in cash would preserve optionality but miss the first bounded exposure to MDA's expanded LEO program and manufacturing platform. The private starter assessment uses only about 2.35 percent of current NAV, leaving more than 74 percent in cash before any unconfirmed owner action and preserving capacity for stronger post-results opportunities.
  conjunctive_evidence_and_price_trigger: The private MDA assessment requires both current mission and evidence gates and its private entry condition during the stated validity window; price alone never authorizes a buy. Reassess GILT, LEU and IONQ only after their scheduled evidence preserves per-share economics, and rerun MDA after August 7 results if the private action expires or remains unfilled.
  next_evidence_deadline: 2026-08-07
  no_action_streak: 19
  article1_red_team_status: completed_current_v1.3_multi_candidate_starter_challenge
  latest_constitutional_audit_path: research/process/2026-07-28-article-one-constitutional-audit.md
  current_conclusion: A bounded private owner-only MDA action assessment is active through its private validity window; exact terms remain withheld from public artifacts and no trade was executed. GILT LEU and IONQ remain at zero pending scheduled evidence. The separate 45-day mission-pressure review remains due on 2026-08-22 unless a mission-relevant deployment is broker-confirmed first.
