  strongest_counterfactual: MDA remains the strongest current configuration candidate after the Telesat expansion and financing close; GILT remains the closest low-denominator challenger, LEU the strongest structural bottleneck expression, IREN the strongest powered-site challenger, and IONQ the post-acquisition quantum-platform challenger.
  smallest_prudent_exposure_considered: A bounded private MDA starter was tested against zero and would be mission-relevant rather than symbolic if the prior order did not fill; exact owner-only terms remain withheld until broker state is resolved.
  zero_vs_starter_result: The bounded MDA starter remains economically superior to zero if no prior order exists, but zero new quantity wins until the owner resolves the prior broker state because the August 5 market traded through the prior limit condition and a renewed recommendation could duplicate intended exposure. GILT LEU and IONQ remain target-specific non-buys after current results.
  zero_exposure_reason_code: other_documented
  decision_critical_missing_evidence: The owner-only state of the prior MDA order is the immediate target-specific blocker. GILT normalized cash conversion and final transaction economics, LEU funded fixed-price contract protection and TENEX substitution, and IONQ post-close unit economics and dilution block those targets, not the whole opportunity set.
  why_risk_sizing_cannot_absorb_uncertainty: MDA operating uncertainty can be bounded by a starter size, but position sizing cannot prevent accidental duplication when a prior order may already have filled. GILT transaction-denominator risk, LEU contract and funding risk, and IONQ post-close unit economics likewise remain target-specific blockers.
  cash_opportunity_cost: Remaining in cash for one day preserves optionality and may miss a short MDA move, but the bounded waiting cost is smaller than the risk of duplicating the intended starter immediately before August 7 results. Confirmed cash remains available once the broker state and new evidence are known.
  conjunctive_evidence_and_price_trigger: A new MDA decision requires both owner confirmation of the prior order state and current mission, evidence and entry gates after August 7 results; price alone never authorizes a buy. GILT LEU and IONQ require their company-specific economics to improve, not merely lower prices.
  next_evidence_deadline: 2026-08-07
