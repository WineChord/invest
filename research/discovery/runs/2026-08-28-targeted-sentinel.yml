first_principles_heading: First-Principles Analysis
first_principles_analysis:
  question_rebuilt_from_basics: Did BRUN's filed quarter, disclosed contracts and current valuation establish a protected path from scarce AI compute to exceptional dilution-adjusted per-share cash value that beats the current opportunity set?
  irreducible_facts:
    - Three disclosed BRUN contracts total approximately USD 901.723 million, while management reports USD 1.9 billion of TCV and a roughly USD 400 million exit-ARR target.
    - Q2 revenue was USD 31.138 million, but only about USD 0.721 million remained after cost of revenue, depreciation and colocation before SG&A.
    - Customer deposits supplied USD 112.949 million of USD 114.249 million first-half operating cash flow, and finance-lease principal payments were USD 99.933 million.
    - Disclosed purchase, software, lease and financial commitments exceed USD 2.0 billion, disclosure controls are ineffective and the current 83845141-share denominator still has incentive-plan dilution capacity.
    - The August 27 USD 20.61 close implies approximately USD 1.728 billion of current equity value and followed a 13.30 percent raw-close one-day increase.
  binding_constraints:
    - Contracted demand must survive customer credit, acceptance and termination conditions.
    - Revenue must exceed GPU depreciation, colocation, power, financing, maintenance, refresh capex and corporate overhead.
    - Residual cash must survive dual-class control and incentive dilution, while the current price must beat LEU, GILT, STDN, held IREN and cash.
  causal_chain: Scarce GPUs and power support binding orders; customer cash funds hardware and sites; accepted capacity produces revenue; full-cost cash exceeds all capital claims; retained cash funds expansion; and the diluted per-share result compounds from a mission-relevant position.
  inherited_assumptions_challenged:
    - Headline gross margin is full infrastructure margin.
    - Customer-deposit cash is recurring owner cash.
    - Management TCV is audited backlog.
    - A sharp price increase creates investment eligibility.
  value_capture_or_mission_link: BRUN is direct and newly public enough to preserve a meaningful right tail, but its present value and obligation stack require several billion dollars of durable full-cost cash-generating revenue before an extreme per-share outcome becomes credible.
  disconfirming_evidence: Diversified creditworthy customers, accepted deployments, recurring normalized cash generation, current cash and obligation coverage, remediated controls, bounded incentive awards and a valuation reset could reverse the zero conclusion.
  decision_consequence: Advance BRUN to R2 comparable for active research, retain incubating and pre-promotion status, keep it outside the top five and recommend no quantity or executable limit.
