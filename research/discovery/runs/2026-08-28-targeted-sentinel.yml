first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Energized and supported advanced-GPU capacity remains scarce, and BRUN has executed contracts for 5000 Thinking Machines B300 GPUs plus two other large orders.
    inferences: Scarcity becomes common-equity value only if deployments earn cash after hardware, colocation, financing and refresh costs.
    disconfirming_evidence: Full-cost contribution is thin and more than half of management TCV remains unreconciled.
    source_ids: [brun_q2_2026_10q, brun_thinking_machines_orders_2026_05_21]
    investment_implication: Preserve BRUN as an R2 comparator without promotion or quantity.
  who_controls_or_removes_scarcity:
    facts: BRUN assembles GPU procurement, powered colocation, automation and multi-year customer orders rather than owning a proprietary GPU or power source.
    inferences: Contract assembly can remove deployment scarcity, but supplier, lessor and customer claims can capture much of the economics.
    disconfirming_evidence: Purchase, software and lease commitments exceed current revenue scale and current unrestricted cash is unavailable.
    source_ids: [brun_q2_2026_10q, brun_q2_results_2026_08_14]
    investment_implication: Require funded deployment and obligation coverage before promotion.
  who_can_monetize_into_shareholder_value:
    facts: Three disclosed contracts total about USD 901.7 million and customer deposits finance part of deployment.
    inferences: Per-share value requires positive normalized cash after deposit changes, lease principal, depreciation, colocation and dilution.
    disconfirming_evidence: Deposits produced nearly all first-half operating cash flow and disclosure controls remain ineffective.
    source_ids: [brun_q2_2026_10q]
    investment_implication: Evidence passes R2 comparison but fails purchase.
  public_security_expression:
    facts: BRUN is Nasdaq-listed, had 83845141 current economic shares and no warrants on August 25, and closed at USD 20.61 on August 27.
    inferences: Direct tradability and a cleared warrant overhang improve observability but do not create a buy zone.
    disconfirming_evidence: The current price implies about USD 1.728 billion of equity value before incentive-plan dilution.
    source_ids: [brun_warrant_redemption_completion_2026_08_26, supplemental_R1_R2_closes_2026_08_27]
    investment_implication: Use the current denominator for comparison and keep the order quantity at zero.
  early_small_misunderstood_or_newly_public:
    facts: BRUN became public in May 2026 and is smaller than many listed compute peers, with a substantial named contract and rapid revenue growth.
    inferences: The right tail is real only if multiple rounds of profitable reinvestment avoid transferring value to lessors, suppliers or new shares.
    disconfirming_evidence: A credible tenfold outcome needs several billion dollars of sustainable revenue and much larger owner cash than current evidence proves.
    source_ids: [brun_q2_2026_10q, brun_q2_results_2026_08_14]
    investment_implication: Advance research depth, not security status.
