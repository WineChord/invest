first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: AI data-center buildout can be constrained by electrical equipment, grid interconnection, substation and transmission work, power quality, large-load project execution, and liquid cooling.
    inferences: ETN and PWR improve coverage of the physical AI infrastructure bottleneck map, while CAT mainly confirms broader power-generation demand.
    disconfirming_evidence: All three companies are already large, mature, and diversified, which limits the probability of extreme satellite-account upside from this entry point.
    source_ids:
      - etn_q1_2026_10q
      - pwr_q1_2026_10q
      - cat_q1_2026_results
    investment_implication: Add ETN and PWR to research-only coverage; do not add CAT to the watchlist.
  who_controls_or_removes_scarcity:
    facts: Eaton supplies electrical distribution, power quality, and liquid-cooling capability. Quanta supplies grid, transmission, substation, large-load, and mechanical infrastructure execution. Caterpillar supplies power-generation equipment through a broader industrial platform.
    inferences: PWR and ETN are closer to the bottleneck execution layer than CAT, but neither is small or pure enough for immediate active status.
    disconfirming_evidence: Contractor execution risk, acquisition integration, commodity and wage inflation, and diversified segment exposure can dilute bottleneck economics.
    source_ids:
      - etn_boyd_thermal_2026_03_12
      - pwr_dynamic_systems_2025_07_31
      - cat_q1_2026_10q
    investment_implication: Prioritize ETN and PWR for monitoring of backlog and data-center order evidence, not buy-zone ranking.
  who_can_monetize_into_shareholder_value:
    facts: ETN monetizes through product margins, services, and backlog conversion. PWR monetizes through infrastructure-service margins and remaining performance obligations. CAT monetizes through equipment sales, dealer channels, and power-generation demand.
    inferences: ETN likely has better product-pricing leverage than PWR, while PWR has more direct grid-build execution leverage. CAT's exposure is less clean.
    disconfirming_evidence: Valuation, cyclicality, project risk, and current scale can absorb much of the visible demand before it becomes asymmetric shareholder value.
    source_ids:
      - etn_q1_2026_10q
      - pwr_q1_2026_10q
      - market_quote_snapshot_2026_06_08_power_industrials
    investment_implication: Keep ETN and PWR research-only until a future promotion review shows a stronger upside-to-risk path.
  public_security_expression:
    facts: ETN, PWR, and CAT are U.S.-listed common stocks with public disclosures and normal retail liquidity under policy v1.1.
    inferences: Tradability is not the blocker; buy eligibility is blocked by status, valuation, scale, and the absence of a promotion review.
    disconfirming_evidence: None of the three creates a new broker-confirmed account fact or execution instruction.
    source_ids:
      - sec_company_tickers_exchange_2026_06_08
      - market_quote_snapshot_2026_06_08_power_industrials
    investment_implication: ETN and PWR can be listed as research-only; CAT should remain a rejected discovery candidate and industry reference.
  early_small_misunderstood_or_newly_public:
    facts: ETN, PWR, and CAT are mature large-cap companies rather than newly public or underfollowed small companies.
    inferences: The main reason to keep ETN and PWR is lane completeness and opportunity-cost monitoring, not likely immediate extreme upside.
    disconfirming_evidence: If a future dislocation or spinout creates a cleaner bottleneck expression, this conclusion should be reopened.
    source_ids:
      - market_quote_snapshot_2026_06_08_power_industrials
      - power_industrials_triage_2026_06_08
    investment_implication: Research-only coverage is appropriate; active promotion requires a later promotion review.

