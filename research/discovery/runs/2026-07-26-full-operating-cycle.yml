first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Grid-connected power, commissioned AI capacity, high-speed interconnect, launch and spacecraft production, spectrum, licensed isotope enrichment and HALEU, water transmission and industrial reuse, and safety-certified autonomous deployment remain plausible constraints.
    inferences: Scarcity is investable only when it converts into durable margin, cash generation and diluted per-share value without excessive financing dependence.
    disconfirming_evidence: Current small and early expressions often capitalize future scarcity before repeatable gross profit or free cash flow exists.
    source_ids:
      - completed_close_universe_2026_07_24
      - sec_submissions_all_forms_2026_07_26
    investment_implication: Preserve cash until evidence and entry align.
  who_controls_or_removes_scarcity:
    facts: LEU, ASPI, CRDO, ALAB, IREN, VRT, RKLB, ASTS, GILT, MDA, NWPX and RIOT are direct or partially direct current expressions across reviewed lanes.
    inferences: Direct exposure is insufficient when lenders, customers, regulators, warrants or new equity capture most economics.
    disconfirming_evidence: Every current expression retains a valuation, concentration, execution, financing, survival or transaction veto.
    source_ids:
      - completed_close_universe_2026_07_24
      - sec_submissions_all_forms_2026_07_26
    investment_implication: Keep the lane map and make no promotion.
  who_can_monetize_into_shareholder_value:
    facts: LEU, GILT, MDA, IREN and CRDO are the next-dollar research queue.
    inferences: Accepted revenue, complete contract economics, repeat orders, cash conversion and survivable capitalization matter more than addressable-market claims.
    disconfirming_evidence: Each priority company retains a contract, valuation, concentration, financing, transaction or correlated-exposure veto.
    source_ids:
      - completed_close_universe_2026_07_24
      - sec_submissions_all_forms_2026_07_26
    investment_implication: Retain confirmed cash and set every new quantity to zero.
  public_security_expression:
    facts: Fifty-four watchlist securities are tradable, OPENAI and ANTHROPIC are not, and XTND does not yet have a policy-eligible completed listing.
    inferences: A low nominal price, sharp decline, registration filing or direct thematic label does not create buy eligibility.
    disconfirming_evidence: Thirty-two tradable securities declined at least 5 percent, but none cleared the remaining gates.
    source_ids:
      - completed_close_universe_2026_07_24
      - sec_submissions_all_forms_2026_07_26
    investment_implication: All current new-buy quantities are zero.
  early_small_misunderstood_or_newly_public:
    facts: ASPI, GILT, NWPX, QSI, STDN, ENRD, OCC and XTND retain genuine smaller, early or awkward characteristics; RIOT remains a larger power-campus transition.
    inferences: ASPI is a direct early fuel-cycle expression, GILT has the clearest small-cap valuation arithmetic and NWPX the strongest recently discovered operating quality, but none currently proves mission-consistent entry.
    disconfirming_evidence: ASPI lacks commercial enriched-isotope sales, permits and production economics and has material dilution; GILT lacks audited transaction cash conversion; NWPX has mature physical-product economics and a large price rise; QSI has listing and adoption risk; STDN lacks authorization and margin proof; ENRD remains fragile; XTND is not tradable.
    source_ids:
      - completed_close_universe_2026_07_24
      - sec_submissions_all_forms_2026_07_26
    investment_implication: Continue research without a current order.
