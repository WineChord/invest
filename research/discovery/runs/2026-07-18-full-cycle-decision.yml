first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Rapid behind-the-meter generation, grid interconnection, AI power equipment, optical bandwidth, launch, spectrum, nuclear fuel, and qualified manufacturing remain plausible constraints.
    inferences: Scarcity creates shareholder value only when delivery, margins, financing, and diluted per-share cash generation are auditable.
    disconfirming_evidence: Current leverage and valuations often capitalize future scarcity before free cash flow is proved.
    source_ids: [sei_q1_2026_10q, stdn_424b4_2026_07_16, completed_close_universe_2026_07_17]
    investment_implication: Preserve cash until evidence and entry align.
  who_controls_or_removes_scarcity:
    facts: SEI operates rapid power capacity, STDN manufactures TRISO, and existing candidates control more mature power, fuel, optical, compute, and space assets.
    inferences: Directness is necessary but insufficient when customers, lenders, regulators, partners, or dilution capture value.
    disconfirming_evidence: SEI and STDN each retain material concentration, financing, execution, or economics vetoes.
    source_ids: [sei_q1_2026_10q, sei_financing_close_2026_05_12, stdn_424b4_2026_07_16]
    investment_implication: Add monitoring coverage without allocating capital.
  who_can_monetize_into_shareholder_value:
    facts: SEI has operating revenue and leases; NBIS has contracted GPU demand; STDN has funded backlog but negative gross economics.
    inferences: Cash offers better option value than paying for unverified long-duration common-share economics.
    disconfirming_evidence: Funded delivery, positive free cash flow, balance-sheet de-risking, diversification, or valuation reset could change the ranking.
    source_ids: [sei_q1_2026_10q, nbis_gpu_facility_2026_07_17, stdn_424b4_2026_07_16]
    investment_implication: Review LEU, GILT, NBIS, and SEI only after their named triggers.
  public_security_expression:
    facts: SEI and STDN are tradable U.S.-listed common stocks; OPENAI and ANTHROPIC are not directly tradable under policy.
    inferences: A listed ticker or lower price does not create buy eligibility.
    disconfirming_evidence: Direct securities still fail evidence, survival, entry, or opportunity-cost gates.
    source_ids: [sei_completed_close_2026_07_17, stdn_completed_close_2026_07_17, completed_close_universe_2026_07_17]
    investment_implication: SEI is watch B, STDN research-only B-, and both are buy zero.
  early_small_misunderstood_or_newly_public:
    facts: STDN is newly listed and SEI is an underfollowed oilfield-to-AI-power transition with complex project structures.
    inferences: Complexity justifies complete readiness and durable monitoring rather than automatic rejection or purchase.
    disconfirming_evidence: Corrected capitalization, debt, dilution, and cash-conversion risk materially weaken headline upside.
    source_ids: [stdn_424b4_2026_07_16, sei_q1_2026_10q, sei_gesa_acquisition_2026_07_06]
    investment_implication: Keep both visible, but allocate zero.

