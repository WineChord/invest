first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Space launch cadence, responsive defense space access, spacecraft manufacturing, AI data-center power, AI interconnect capacity, advanced nuclear fuel/licensing, and direct-to-device spectrum/capacity remain active scarcity hypotheses.
    inferences: The space infrastructure lane remains decision-relevant because new public companies can appear and affect opportunity cost versus RKLB, ASTS, LUNR, RDW, and KTOS.
    disconfirming_evidence: Many deterministic keyword hits were funds, broad suppliers, or weak proxies rather than direct bottleneck owners.
    source_ids:
      - fly_q1_2026_results
      - fly_s1_offering_2026_05_26
      - sec_fly_submissions_2026_05_31
      - defensescoop_golden_dome_sbi_2026_04_24
    investment_implication: Do not treat the existing watchlist as complete when a same-lane public candidate appears.
  who_controls_or_removes_scarcity:
    facts: Public candidates can control or remove scarcity only through owned assets, technical capability, regulatory permission, manufacturing capacity, customer access, or contract execution.
    inferences: FLY may control part of the launch and spacecraft bottleneck, but this must be verified through filings, backlog, customer, margin, cash runway, and dilution review.
    disconfirming_evidence: A company can reference space infrastructure without owning durable pricing power.
    source_ids:
      - fly_q1_2026_results
      - fly_s1_offering_2026_05_26
      - sec_fly_submissions_2026_05_31
      - defensescoop_golden_dome_sbi_2026_04_24
    investment_implication: Candidate triage must distinguish direct bottleneck owners from promotional proxies.
  who_can_monetize_into_shareholder_value:
    facts: Monetization requires pricing power, backlog conversion, cash runway, reinvestment paths, and dilution discipline. FLY's Q1 2026 revenue was USD 80.879 million, Q1 2026 net loss was USD 96.676 million, and March 31 2026 cash and equivalents were USD 326.179 million.
    inferences: FLY can be incubated after first-pass review, but it cannot be promoted until offering-adjusted valuation, runway, backlog quality, and filing quality are reviewed more deeply.
    disconfirming_evidence: Launch and spacecraft demand can still destroy shareholder value if execution failures or dilution dominate.
    source_ids:
      - fly_s1_offering_2026_05_26
      - sec_companyfacts_fly_2026_05_31
    investment_implication: FLY remains raw and incubating; it does not currently displace RKLB or ASTS.
  public_security_expression:
    facts: SEC submissions identify Firefly Aerospace Inc. as Nasdaq ticker FLY, and Yahoo chart data identifies FLY as a NasdaqGM equity with a 2026-05-29 close near USD 46.49 and roughly 22.3 million shares of daily volume.
    inferences: FLY is policy-eligible as a public U.S.-listed common stock, but eligibility is not buy readiness.
    disconfirming_evidence: Recent S-1, 424B3, EFFECT, and Form 144 filings mean offering and selling-holder effects remain material.
    source_ids:
      - fly_s1_offering_2026_05_26
      - sec_fly_submissions_2026_05_31
      - yahoo_chart_fly_2026_05_29
    investment_implication: Keep FLY in incubating research-only visibility until new quarterly, offering, selling-holder, contract, launch, or price evidence supports promotion.
  early_small_misunderstood_or_newly_public:
    facts: FLY appears newly public and less embedded in the existing watchlist than RKLB or ASTS.
    inferences: It may be more underfollowed, but the offering filing can also create dilution or selling pressure that weakens the setup.
    disconfirming_evidence: Early public status alone is not enough; the candidate must clear evidence and entry gates.
    source_ids:
      - fly_s1_offering_2026_05_26
      - sec_fly_submissions_2026_05_31
    investment_implication: Incubate after first-pass readiness review rather than buying or ignoring the name.

subagents:
