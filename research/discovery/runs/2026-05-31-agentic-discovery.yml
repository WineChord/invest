        - deterministic universe dry-run output
      sources_checked:
        - fly_q1_2026_results
        - fly_s1_offering_2026_05_26
      facts_verified:
        - FLY is the strongest same-lane raw space lead from the discovery review.
      stale_or_missing_evidence:
        - Original missing FLY market data, first-pass valuation evidence, filing-package review, and dashboard-facing records were resolved by the readiness sprint; future promotion requires new evidence rather than unfinished repository work.
      confidence: medium_high_for_raw_candidate_incubation
      key_findings: FLY was the strongest dry-run lead and required incubation plus research-only dashboard visibility after filing, valuation, and peer review.
      conflicts: []
    - role: freshness_filing_review
      reasoning_level: xhigh
      independent_context: true
      completed: true
      skip_reason:
      inputs_used:
        - research/watchlist.csv
        - research/freshness/events.csv
        - SEC submissions checks
        - company IR checks
      sources_checked:
        - sec_active_universe_filings_2026_05_30
        - fly_q1_2026_results
        - fly_s1_offering_2026_05_26
      facts_verified:
        - No post-2026-05-30 active-watchlist filing blocked the original RKLB or ASTS staged order.
      stale_or_missing_evidence:
        - FLY no longer has repository-work readiness outstanding after dashboard-facing sprint completion; future promotion requires new quarterly, offering, selling-holder, contract, launch, or price evidence.
      confidence: high_for_active_watchlist_filing_freshness
      key_findings: No post-run blocker for RKLB or ASTS; FLY was incubated after follow-up readiness work.
      conflicts: []
    - role: bull_case
      reasoning_level: xhigh
      independent_context: true
      completed: true
      skip_reason:
      inputs_used:
        - research/watchlist.csv
        - research/valuation-states.csv
        - research/filings
        - confirmed account cash state
      sources_checked:
        - yahoo_chart_close_2026_05_29
        - sec_active_universe_filings_2026_05_30
      facts_verified:
        - RKLB and ASTS remained the original strongest mission-fit staged candidates from the active watchlist.
      stale_or_missing_evidence:
        - FLY dashboard-facing readiness is now resolved, but new evidence is required before it can compete for allocation promotion.
      confidence: medium
      key_findings: Strongest bull case remained staged RKLB plus ASTS, subject to risk review.
      conflicts:
        - Bear case preferred no buy or only one RKLB share due entry risk.
    - role: bear_case
      reasoning_level: xhigh
      independent_context: true
      completed: true
      skip_reason:
      inputs_used:
        - research/valuation-states.csv
        - company metrics
        - technical snapshots
        - filing reviews
      sources_checked:
        - yahoo_chart_close_2026_05_29
        - sec_active_universe_filings_2026_05_30
      facts_verified:
        - RKLB and ASTS had strong mission fit but demanding valuation and execution risk.
      stale_or_missing_evidence:
        - Broker fees and fractional share capability were unknown.
      confidence: medium_high
      key_findings: Entry quality and valuation risk argued for holding cash or a much smaller starter.
      conflicts:
        - Bull case preferred more convex ASTS exposure.
    - role: allocation_risk
      reasoning_level: xhigh
      independent_context: true
      completed: true
      skip_reason:
