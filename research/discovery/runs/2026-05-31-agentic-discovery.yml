unknown_future_review:
  exploratory_match_count: 57
  top_clusters:
    - generic infrastructure and platform wording
    - broad network or mission-critical issuer names
    - companies whose names lacked primary-source bottleneck evidence
  sampled_symbols:
    - AD
    - ACIC
    - ABL
  disposition: No new lane created from the 2026-05-31 exploratory bucket; future runs must keep sampling because the lane is intentionally open-ended.
  false_positive_patterns:
    - generic infrastructure names without source-backed scarcity control
    - platform language without direct pricing power evidence
    - mission-critical wording outside an investable bottleneck thesis
  lane_decisions:
    - keep unknown_future_bottlenecks active as a lane-review trigger
    - require primary-source evidence before converting exploratory matches into ordinary raw candidates
    - split out a new named lane only when several sampled exploratory matches share the same concrete bottleneck

