first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Launch, spectrum, AI compute, interconnected power, optical bandwidth, nuclear fuel, qualified manufacturing, and regulatory permissions remain plausible constraints.
    inferences: Scarcity creates shareholder value only when delivery, margin, financing, customer economics, and diluted per-share cash generation are auditable.
    disconfirming_evidence: Current valuations and leverage often capitalize future scarcity before operating proof.
    source_ids: [stdn_s1a_ipo_2026_07_15, cifr_q1_2026_10q, occ_q2_2026_10q]
    investment_implication: Preserve cash until evidence and entry align.
  who_controls_or_removes_scarcity:
    facts: STDN may control TRISO capacity, CIFR controls powered campuses, OCC supplies optical connectivity, and existing active companies provide more mature expressions.
    inferences: Directness is necessary but insufficient when debt providers, customers, regulators, or dilution capture value.
    disconfirming_evidence: Each new lead has a material financing, execution, concentration, tradability, or evidence veto.
    source_ids: [stdn_s1a_ipo_2026_07_15, cifr_project_notes_2026_06_15, occ_q2_2026_10q]
    investment_implication: Add research coverage but buy zero.
  who_can_monetize_into_shareholder_value:
    facts: Existing operating candidates have stronger proof than STDN; CIFR has contracts but no reported AI rent; OCC has improving results but unquantified data-center mix.
    inferences: Cash offers better option value than paying for unverified long-duration economics.
    disconfirming_evidence: Funded delivery, positive free cash flow, balance-sheet de-risking, or a thesis-preserving valuation reset could change ranking.
    source_ids: [gilt_skyedge_orders_2026_07_15, cifr_q1_2026_10q, occ_q2_2026_10q]
    investment_implication: Review LEU MDA and GILT first after explicit triggers.
  public_security_expression:
    facts: CIFR and OCC are tradable Nasdaq common stocks; STDN expected NYSE common lacked a completed close; OPENAI and ANTHROPIC remain not tradable.
    inferences: A listed ticker does not create entry eligibility and an expected offering price is not market data.
    disconfirming_evidence: Direct securities can still fail evidence, survival, and entry gates.
    source_ids: [stdn_s1a_ipo_2026_07_15, alpaca_iex_cifr_close_2026_07_15, alpaca_iex_occ_close_2026_07_15]
    investment_implication: Keep STDN not tradable and CIFR and OCC research-only.
  early_small_misunderstood_or_newly_public:
    facts: STDN is newly public, CIFR is a business-model transition, and OCC is a very small underfollowed optical supplier.
    inferences: Complexity merits full readiness and dashboard visibility rather than automatic rejection or purchase.
    disconfirming_evidence: Corrected valuation, leverage, liquidity, and dilution are materially less attractive than headline narratives.
    source_ids: [stdn_s1a_ipo_2026_07_15, cifr_q1_2026_10q, occ_q2_2026_10q]
    investment_implication: Incubate research and allocate zero.

