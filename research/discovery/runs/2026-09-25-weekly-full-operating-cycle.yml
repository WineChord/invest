first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Deployable space communications, domestic nuclear fuel, energized compute, strategic materials processing, optical interconnect and reliable quantum control remain plausible bottlenecks.
    inferences: Scarcity is investable only when funded demand, delivery and residual common-equity economics are jointly visible.
    disconfirming_evidence: Capital intensity, technical substitution, customer concentration, financing claims and dilution can prevent physical scarcity from producing shareholder value.
    source_ids: [sec_event_index_targeted_72_2026_09_25, sec_foundational_index_targeted_72_2026_09_25]
    investment_implication: Preserve current starters and make LEU the leading dated nonholding review without opening a new position.
  who_controls_or_removes_scarcity:
    facts: Current holdings and candidates control different parts of launch, communications, fuel, powered-compute and manufacturing chains, while new registrations offer future comparison points.
    inferences: Direct control matters more than labels but still requires operating rights, customer acceptance and funded scale.
    disconfirming_evidence: A supplier can control a technical layer while customers, creditors or repeated equity issuance capture most economics.
    source_ids: [sec_event_index_targeted_72_2026_09_25, sec_omitted_forms_2026_09_25]
    investment_implication: Correct capital denominators before scaling any direct bottleneck exposure.
  who_can_monetize_into_shareholder_value:
    facts: GILT has operating profit and an existing starter; LEU has binding customers and new capital; RKLB has a larger financed platform; each still has a different cash-return or entry gap.
    inferences: Monetization requires recurring cash after capital needs and claims, not contract count, backlog or financing alone.
    disconfirming_evidence: Weak unit economics, adverse integration, unbounded capex or further dilution would break the per-share chain.
    source_ids: [completed_close_universe_2026_09_24, sec_event_index_targeted_72_2026_09_25]
    investment_implication: Hold existing quantities and keep every incremental equity quantity at zero through the near-term LEU checkpoint.
  public_security_expression:
    facts: The deterministic reference includes 7662 eligible securities by name and ticker, while paired SEC review intentionally targets 72 listed decision-universe symbols.
    inferences: Listing and observability do not create buy eligibility, and targeted SEC coverage is not a full-market semantic search.
    disconfirming_evidence: A current listed issuer with protected economics, correct capitalization and a superior entry could displace the present ordering.
    source_ids: [completed_close_universe_2026_09_24, sec_event_index_targeted_72_2026_09_25]
    investment_implication: No current new public-security expression clears promotion and allocation gates.
  early_small_misunderstood_or_newly_public:
    facts: IMC and REA are early strategic-materials leads; NSCALE, SeeQC and Accelevation are pre-listing direct comparators; INFQ has a new technical milestone.
    inferences: Small or new denominators enlarge upside only when technology, financing and per-share capture survive primary-source review.
    disconfirming_evidence: Going-concern risk, inferred-only resources, prelisting status, high sales multiples or technical demonstrations without paid utility can dominate the right tail.
    source_ids: [sec_omitted_forms_2026_09_25, public_community_triage_2026_09_25]
    investment_implication: Route these leads to dated readiness work rather than promotion or purchase.
