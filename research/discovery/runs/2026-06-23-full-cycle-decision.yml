first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Launch cadence, responsive space, direct-to-device capacity, AI interconnect bandwidth, AI power and cooling, frontier AI distribution, and sovereign infrastructure remain plausible bottlenecks.
    inferences: RKLB and ASTS remain the best existing mission-aligned public holdings, while SPCX is now the most important public opportunity-cost comparator.
    disconfirming_evidence: Neutron delay, ASTS on-orbit or financing failure, SPCX valuation reset, CRDO customer concentration deterioration, or a material macro liquidity shock would force a rerun.
    source_ids:
      - rklb_victus_haze_2026_06_22
      - asts_bluebird_8_10_launch_2026_06_17
      - crdo_10k_fy2026
      - spcx_notes_8k_2026_06_22
    investment_implication: Hold cash rather than force a new trade immediately after confirmed RKLB and ASTS adds.
  who_controls_or_removes_scarcity:
    facts: Rocket Lab controls a smaller vertical space platform; ASTS controls a high-risk direct-to-device architecture; SpaceX controls the strongest absolute cross-lane platform but now trades as a much larger public common-stock base.
    inferences: Current per-dollar asymmetry still favors existing RKLB and ASTS exposure over chasing SPCX, but the account should not overweight space immediately after the latest fills.
    disconfirming_evidence: A large thesis-preserving price reset or major de-risking event could reopen a private capped entry.
    source_ids:
      - rklb_victus_haze_2026_06_22
      - spcx_notes_8k_2026_06_22
    investment_implication: No sell; no immediate add.
  who_can_monetize_into_shareholder_value:
    facts: RKLB has stronger operating execution evidence, ASTS has higher binary convexity, CRDO has strong AI interconnect quality but concentrated customers, and SPCX has unmatched scale with public-entry complexity.
    inferences: The strongest marginal action is patience, not a forced order.
    disconfirming_evidence: Customer diversification at CRDO, on-orbit ASTS economics, Neutron proof, or SPCX post-IPO valuation compression could change ranking.
    source_ids:
      - crdo_10k_fy2026
      - market_quote_snapshot_2026_06_23
    investment_implication: Preserve optionality in USD cash.
  public_security_expression:
    facts: The current buyable universe remains U.S.-listed common stocks and approved short-duration Treasury reserve ETFs under policy v1.1; SGOV is an ETF, not cash.
    inferences: Tradability does not equal buy eligibility; watch, research-only, and not-tradable rows cannot receive new buys without promotion where applicable.
    disconfirming_evidence: Broker restrictions, quote gaps, new filings, or SGOV mechanics would require private execution review.
    source_ids:
      - sec_event_filing_index_2026_06_23
      - ishares_sgov_2026_06_04
    investment_implication: No SGOV by default and no lower-status buys.
  early_small_misunderstood_or_newly_public:
    facts: RKLB and ASTS are still earlier and more volatile than mature AI infrastructure names; SPCX is newly public but not small; CRDO is high-quality but expensive and concentrated.
    inferences: The no-action decision best preserves the satellite account's long-horizon optionality.
    disconfirming_evidence: Fresh de-risking with valuation reset could justify a future capped entry.
    source_ids:
      - community_triage_2026_06_23
      - new_lead_sec_filing_index_2026_06_23
    investment_implication: Future triage continues, but no current order.

