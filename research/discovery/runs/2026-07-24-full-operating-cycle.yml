first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Grid-connected power, commissioned AI capacity, high-speed interconnect, launch and spacecraft production, spectrum, HALEU and TRISO fuel, and safety-certified autonomous deployment remain plausible constraints.
    inferences: Scarcity is investable only when it converts into durable margin, cash generation, and diluted per-share value without excessive financing dependence.
    disconfirming_evidence: Current small and early expressions often capitalize future scarcity before repeatable gross profit or free cash flow exists.
    source_ids: &a1
      - completed_close_universe_2026_07_23
      - sec_submissions_all_forms_2026_07_24
    investment_implication: Preserve cash until evidence and entry align.
  who_controls_or_removes_scarcity:
    facts: LEU, CRDO, ALAB, IREN, VRT, RKLB, ASTS, GILT, MDA, ENRD, and XTND remain the most direct current or emerging expressions across the reviewed lanes.
    inferences: Direct exposure is insufficient when lenders, customers, regulators, warrants, earnouts, or new equity capture most economics.
    disconfirming_evidence: Every current expression retains a valuation, concentration, execution, financing, survival, or transaction veto.
    source_ids: *a1
    investment_implication: Keep the lane map and make no promotion.
  who_can_monetize_into_shareholder_value:
    facts: IREN, LEU, CRDO, GILT, and MDA remain the priority-five research queue.
    inferences: Accepted revenue, complete contract economics, repeat orders, cash conversion, and survivable capitalization matter more than addressable-market claims.
    disconfirming_evidence: Each priority company retains a contract, valuation, concentration, financing, transaction, or correlated-exposure veto.
    source_ids: *a1
    investment_implication: Retain confirmed cash and set every new quantity to zero.
  public_security_expression:
    facts: Fifty-one watchlist securities are tradable, OPENAI and ANTHROPIC are not, and XTND does not yet have a policy-eligible completed listing.
    inferences: A low nominal price, registration filing, sharp decline, or direct thematic label does not create buy eligibility.
    disconfirming_evidence: Seven symbols declined at least 5 percent in the completed session, but none cleared the remaining gates.
    source_ids: *a1
    investment_implication: All current new-buy quantities are zero.
  early_small_misunderstood_or_newly_public:
    facts: GILT, QSI, STDN, ENRD, OCC, and XTND retain genuine early, small, or awkward characteristics.
    inferences: GILT is the strongest economically grounded small-cap case; QSI is a balance-sheet-backed research option; ENRD is an unusual autonomy expression.
    disconfirming_evidence: GILT has transaction and correlated-space risk; QSI lacks launch adoption; STDN lacks authorization and margin proof; ENRD remains financially fragile; XTND is not tradable.
    source_ids: *a1
    investment_implication: Continue research without a current order.
