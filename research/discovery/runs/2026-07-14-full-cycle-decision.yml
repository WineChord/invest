first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Launch, integrated spacecraft, direct-to-device service, AI compute campuses, power, cooling, optical bandwidth, advanced nuclear licensing, fuel, and qualified production remain plausible constraints.
    inferences: Contracts and capacity announcements matter only when financing, delivery, margin, cash collection, and diluted per-share value are auditable.
    disconfirming_evidence: Current valuations frequently capitalize future scarcity before operating proof appears.
    source_ids: [wulf_anthropic_lease_2026_07_06, imsr_texas_am_rellis_2026_06_18, poet_production_scale_2026_06_30]
    investment_implication: Preserve the lane map and retain cash until evidence and entry align.
  who_controls_or_removes_scarcity:
    facts: RKLB ASTS WULF IMSR POET LEU MDA GILT CRDO ALAB and VRT provide direct but differently mature public expressions.
    inferences: Directness is necessary but insufficient when counterparties, regulators, debt providers, or dilution capture most value.
    disconfirming_evidence: Every current candidate has at least one material ownership, financing, execution, concentration, or valuation veto.
    source_ids: [rklb_victus_haze_completion_2026_07_07, mda_offering_close_2026_07_14, wulf_q1_2026_10q]
    investment_implication: No current new buy.
  who_can_monetize_into_shareholder_value:
    facts: RKLB and ASTS are confirmed holdings; MDA and GILT have operating revenue; WULF IMSR and POET remain dependent on future conversion milestones.
    inferences: Cash currently offers better option value than paying for unverified long-duration economics.
    disconfirming_evidence: Favorable MDA acquisition data, LEU contract economics, GILT closing, or production conversion could change the ranking.
    source_ids: [mda_q1_2026, leu_haleu_contract_2026_07_02, gilt_q1_2026]
    investment_implication: Review LEU MDA GILT first after explicit triggers.
  public_security_expression:
    facts: Forty-four research symbols are U.S.-listed and tradable under policy; OPENAI and ANTHROPIC remain not tradable.
    inferences: Tenant or supplier exposure cannot be mislabeled as private-company equity exposure.
    disconfirming_evidence: Direct listed status does not create entry eligibility.
    source_ids: [wulf_q1_2026_10q, imsr_q1_2026_10q, poet_direct_offering_2026_05_18]
    investment_implication: Keep OPENAI and ANTHROPIC monitor-only and all new public candidates research-only.
  early_small_misunderstood_or_newly_public:
    facts: WULF IMSR and POET provide awkward or early direct expressions with material capitalization complexity.
    inferences: Their complexity merits full readiness and dashboard visibility rather than automatic rejection or purchase.
    disconfirming_evidence: Corrected basic and diluted values are much less attractive than headline prices or vendor values suggest.
    source_ids: [wulf_q1_2026_10q, imsr_q1_2026_10q, poet_direct_offering_2026_05_18]
    investment_implication: Incubate all three at C+ and buy zero.

