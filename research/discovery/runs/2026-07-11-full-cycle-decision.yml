first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Spacecraft production ground communications nuclear fuel logistics permits quantum system delivery power memory and interconnect capacity remain plausible structural constraints.
    inferences: The scarce object is often qualified delivery and distribution rather than the headline technology.
    disconfirming_evidence: Mature low-margin suppliers and token or legacy pivots can match keywords without bottleneck pricing power.
    investment_implication: Separate economic sublanes and require direct control before adding candidates.
    source_ids: [discovery_scan_2026_07_11, mda_q1_2026, gilt_q1_2026, leu_haleu_contract_2026_07_02]
  who_controls_or_removes_scarcity:
    facts: MDA and Gilat deliver systems today; LEU controls strategic enrichment capability; IQM and D-Wave deliver quantum systems; most nuclear microcaps remain pre-commercial.
    inferences: Existing revenue and delivery quality are stronger control evidence than promotional roadmaps.
    disconfirming_evidence: Scale and mature economics may cap asymmetry even when control is real.
    investment_implication: MDA and GILT become operating comparators while early nuclear and quantum names remain research-only.
    source_ids: [mda_q1_2026, gilt_q1_2026, iqmx_424b3_2026_06_05, nne_q1_2026]
  who_can_monetize_into_shareholder_value:
    facts: Gilat is profitable and MDA has adjusted EBITDA; LEU has a strategic contract but incomplete fixed-price economics; most quantum and advanced-nuclear peers are loss-making.
    inferences: Contract size or technical relevance does not guarantee common-share value after cost overruns dilution debt and customer bargaining power.
    disconfirming_evidence: LEU could still produce high returns if the full contract is profitable and commercial follow-ons emerge.
    investment_implication: Promote LEU for monitoring but keep cash until per-share economics clear.
    source_ids: [gilt_q1_2026, mda_q1_2026, leu_q1_2026_10q, leu_haleu_contract_2026_07_02]
  public_security_expression:
    facts: Thirty-six dashboard symbols are tradable U.S.-listed securities; OPENAI and ANTHROPIC remain private; rejected pivots and weak proxies do not improve direct exposure.
    inferences: Public availability is necessary but not sufficient; security form and shareholder capture matter.
    disconfirming_evidence: A listed instrument can still be ineligible by policy or economically indirect.
    investment_implication: Keep private issuers not tradable and reject proxy structures that add policy capital or governance risk.
    source_ids: [discovery_scan_2026_07_11, iqmx_424b3_2026_06_05]
  early_small_misunderstood_or_newly_public:
    facts: IQMX HQ NUCL MDA and several rejected leads are newly public or newly accessible; GILT may be underfollowed because of mature labeling and a transaction-driven change.
    inferences: Newness improves discovery priority but raises capitalization reporting controls and dilution risk.
    disconfirming_evidence: QBTS and other early quantum issuers already have multi-billion-dollar valuations.
    investment_implication: Incubate material new issuers with comparable dashboard data but do not confuse novelty with entry value.
    source_ids: [iqmx_424b3_2026_06_05, hq_20f_2026, nucl_q1_2026, gilt_comtech_2026_06_15]

