      stale_or_missing_evidence: none reachable that remains unfinished
      confidence: high
      key_findings: Hold both positions and cash; buy and sell zero.
    - role: allocation_risk
      reasoning_level: xhigh
      independent_context: true
      completed: true
      inputs_used: [confirmed account state, current estimates, bull and bear cases, maximum-loss scenarios]
      sources_checked: [leu_haleu_contract_2026_07_02, leu_q1_2026_10q, yahoo_chart_close_2026_07_10]
      facts_verified: One LEU share would be survivable and retain substantial cash, but the existing RKLB and ASTS concentration remains the dominant portfolio risk.
      stale_or_missing_evidence: Broker preview and full contract economics are unavailable.
      confidence: medium
      key_findings: A bounded starter could pass risk sizing, but sizing alone does not resolve the evidence conflict.
