first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Qualified nuclear enrichment capacity, deployable quantum sensing, resilient positioning, useful quantum compute, launch, satellite connectivity, AI compute, power, cooling, memory, and interconnect remain plausible constraints.
    inferences: Field-qualified delivery, regulated capacity, and funded scale matter more than technology labels.
    disconfirming_evidence: Current valuations can pre-price scarcity before durable per-share economics exist.
    source_ids: [leu_haleu_contract_2026_07_02, infq_q1_2026_10q]
    investment_implication: Preserve the bottleneck map but require auditable shareholder capture and entry margin.
  who_controls_or_removes_scarcity:
    facts: Centrus controls the only U.S. commercial HALEU production path now under a major capacity contract, while Infleqtion integrates atomic hardware and software for compute, sensing, and resilient positioning.
    inferences: Both are direct expressions, but fixed-price execution and immature operating proof can transfer value away from shareholders.
    disconfirming_evidence: Contract overruns, dilution, low margins, customer concentration, and technology competition may overwhelm scarcity value.
    source_ids: [leu_haleu_contract_2026_07_02, leu_q1_2026_10q, infq_q1_2026_10q]
    investment_implication: Keep LEU active and INFQ research-only; buy zero until the evidence and entry gates align.
  who_can_monetize_into_shareholder_value:
    facts: Centrus gains title to completed capacity only after performance; INFQ has revenue and RPO but only 21 percent Q1 gross margin and high government concentration.
    inferences: Neither current entry offers enough auditable per-share capture to beat cash today.
    disconfirming_evidence: Favorable LEU contract terms or rapid INFQ margin and commercial-mix improvement could change the ranking.
    source_ids: [leu_haleu_contract_2026_07_02, infq_q1_2026_ir, infq_q1_2026_10q]
    investment_implication: Retain cash and monitor explicit filing and operating triggers.
  public_security_expression:
    facts: Forty research symbols are U.S.-listed and tradable under policy; OPENAI and ANTHROPIC remain not tradable; INFQ common stock is eligible but its warrants are not.
    inferences: Direct listing is necessary but cannot substitute for evidence, valuation, or security-level analysis.
    disconfirming_evidence: A direct listed issuer can still be unattractive at the current capitalization.
    source_ids: [infq_listing_8k_2026_02_17, infq_q1_2026_10q]
    investment_implication: Incubate INFQ common stock only and exclude its warrants and private proxy substitutions.
  early_small_misunderstood_or_newly_public:
    facts: INFQ began public trading in February 2026 and offers a missing quantum-sensing comparator; its approximately USD 2.44 billion basic equity value is already demanding relative to guidance.
    inferences: Listing recency and awkward technical exposure justify research priority, not automatic entry.
    disconfirming_evidence: Real deployments and liquidity do not offset the current multiple, margin, concentration, and dilution profile.
    source_ids: [infq_listing_8k_2026_02_17, infq_q1_2026_10q, infq_q1_2026_ir]
    investment_implication: Complete dashboard coverage, assign research-only B-, and buy zero.

