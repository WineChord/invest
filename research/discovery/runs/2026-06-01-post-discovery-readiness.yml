first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Proliferated defense spacecraft production, post-ISS LEO infrastructure, and fault-tolerant quantum architectures all surfaced from the xhigh semantic set.
    inferences: The post-discovery run needed to improve peer-map completeness without confusing thematic exposure with buy readiness.
    disconfirming_evidence: MNTS shows that direct thematic exposure can still fail when financing and dilution overwhelm bottleneck control.
    source_ids:
      - yss_q1_2026_10q
      - voyg_q1_2026_10q
      - xndu_q1_2026_6k
      - mnts_q1_2026_10q
    investment_implication: Add durable coverage only when primary evidence supports comparable research value; reject direct but low-quality false positives.
  who_controls_or_removes_scarcity:
    facts: YSS has direct spacecraft production and operations evidence, VOYG has defense-space and Starlab exposure, XNDU controls a photonic quantum architecture, and MNTS has smaller space-services exposure.
    inferences: Control quality differs sharply; YSS has the strongest current operating evidence while MNTS lacks enough proof of durable control.
    disconfirming_evidence: Small market cap, keywords, or public tradability alone do not prove control over scarcity.
    source_ids:
      - yss_q1_2026_results
      - voyg_q1_2026_results
      - xndu_f1_yorkville_2026_05_22
      - mnts_private_placement_8k_2026_05_29
    investment_implication: Treat YSS, VOYG, and XNDU as comparable research surfaces; keep MNTS out of dashboard coverage.
  who_can_monetize_into_shareholder_value:
    facts: YSS has Q1 revenue above USD 100 million and backlog above USD 600 million; VOYG has smaller current revenue and convertible debt; XNDU has tiny professional-services revenue; MNTS has tiny revenue and financing dependence.
    inferences: Shareholder-value conversion is plausible for YSS and uncertain for VOYG and XNDU, but currently weakest for MNTS.
    disconfirming_evidence: Losses, customer concentration, material weaknesses, convertible debt, standby equity facilities, and private placements can prevent bottleneck exposure from compounding into common-stock value.
    source_ids:
      - yss_q1_2026_10q
      - voyg_q1_2026_10q
      - xndu_f1_yorkville_2026_05_22
      - mnts_private_placement_8k_2026_05_29
    investment_implication: No post-discovery name becomes buy-ready; the value is coverage quality and opportunity-cost awareness.
  public_security_expression:
    facts: SEC and Yahoo evidence confirmed MNTS and XNDU as Nasdaq common-stock tickers and VOYG and YSS as NYSE common-stock tickers.
    inferences: Policy tradability is satisfied for all four, but policy eligibility is only the first gate.
    disconfirming_evidence: XNDU's public Class B shares have weaker voting control, and VOYG/YSS governance also requires monitoring.
    source_ids:
      - yahoo_chart_mnts_2026_05_29
      - yahoo_chart_voyg_2026_05_29
      - yahoo_chart_xndu_2026_05_29
      - yahoo_chart_yss_2026_05_29
    investment_implication: Public tradability supports readiness classification but not automatic watchlist promotion.
  early_small_misunderstood_or_newly_public:
    facts: VOYG, XNDU, and YSS are recently public enough to plausibly be under-modeled; MNTS is small but has severe financing and dilution risk.
    inferences: Newly public status improves discovery importance, while corrected share count and capital structure prevent naive valuation conclusions.
    disconfirming_evidence: XNDU looked cheaper under weighted-average shares until F-1 share count corrected the market-cap denominator.
    source_ids:
      - voyg_ipo_prospectus_2025_06_10
      - yss_ipo_prospectus_2026_01_28
      - xndu_f1_yorkville_2026_05_22
      - sec_companyfacts_xndu_2026_06_01
    investment_implication: Keep the newly public discovery lane active and require share-count/debt sanity checks before valuation conclusions.

