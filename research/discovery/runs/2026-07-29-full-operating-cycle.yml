first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: HALEU, energized AI-ready power, high-speed interconnect, launch and spacecraft production, spectrum and verified quantum systems remain plausible bottlenecks.
    inferences: Scarcity matters only when common shareholders capture durable pricing and reinvestment economics.
    disconfirming_evidence: Current public expressions often capitalize future scarcity before contracts, cash conversion or diluted per-share value is proved.
    source_ids: [completed_close_universe_2026_07_28, sec_submissions_all_forms_2026_07_29]
    investment_implication: Keep LEU, GILT, MDA, IREN and CRDO as the dated next-dollar queue.
  who_controls_or_removes_scarcity:
    facts: LEU controls the strongest current listed HALEU path; VIP may control powered land but has no funded AI customer.
    inferences: Direct assets do not help if customers, lenders, secured notes, warrants or repeated equity issuance capture the economics.
    disconfirming_evidence: VIP's proposed recapitalization and going-concern risk show why nominal asset control is insufficient.
    source_ids: [leu_haleu_contract_2026_07_02, vip_ai_hpc_pivot_2026_07_20]
    investment_implication: LEU remains first; VIP remains R1 only.
  who_can_monetize_into_shareholder_value:
    facts: LEU has the strongest mission fit, GILT the nearest low-denominator cash-generating counterfactual and CRDO the strongest operating quality.
    inferences: LEU contract economics and GILT cash conversion can change the sign of per-share value; CRDO's current denominator reduces extreme-upside odds.
    disconfirming_evidence: None of the three clears all gates at the July 28 price with current evidence.
    source_ids: [leu_haleu_contract_2026_07_02, gilt_q1_2026, completed_close_universe_2026_07_28]
    investment_implication: Wait only through the hard August 5–6 adjudication; do not roll the same zero.
  public_security_expression:
    facts: Fifty-four established watchlist securities are tradable; OPENAI and ANTHROPIC are not; XTND is pre-listing; VIP is a policy-eligible common stock retained at R1.
    inferences: Tradability and a low nominal price do not create buy eligibility.
    disconfirming_evidence: VIP's thin current-symbol history and unresolved recapitalization prevent a reliable entry denominator.
    source_ids: [completed_close_universe_2026_07_28, vip_q1_2026_10q]
    investment_implication: No current new order or executable limit.
  early_small_misunderstood_or_newly_public:
    facts: GILT, ASPI, OCC, QSI, STDN, ENRD, VIP and XTND remain early, small or awkward expressions.
    inferences: These characteristics can improve asymmetry only after survival and per-share value capture are credible.
    disconfirming_evidence: VIP is the smallest new lead but also has the weakest current survival and dilution structure.
    source_ids: [gilt_q1_2026, vip_q1_2026_10q]
    investment_implication: Keep GILT nearest to entry and VIP at R1.

