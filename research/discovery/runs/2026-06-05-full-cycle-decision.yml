first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Launch cadence, spacecraft manufacturing, defense-space backlog conversion, direct-to-device spectrum and carrier distribution, AI interconnect, AI power, nuclear fuel and licensing, and quantum commercialization remain the current scarce constraints.
    inferences: Space infrastructure and direct-to-device connectivity remain the lanes most relevant to the first deployment.
    disconfirming_evidence: New same-lane candidates still show valuation, dilution, financing, acquisition, or short-history blockers.
    source_ids:
      - sec_company_tickers_exchange_2026_06_05
      - sec_event_filing_index_2026_06_05
      - market_quote_snapshot_2026_06_05
    investment_implication: RKLB and ASTS remain the current outputs of the bottleneck map, with price discipline blocking RKLB today.
  who_controls_or_removes_scarcity:
    facts: RKLB controls a public launch and space-systems execution path; ASTS controls a direct-to-device satellite network path; YSS, FLY, VOYG, and MDA may matter but remain less buy-ready.
    inferences: RKLB is still the broadest public space-platform expression; ASTS is still the cleanest D2D convexity expression.
    disconfirming_evidence: FLY's offering, YSS integration risk, VOYG acquisition risk, and raw-candidate uncertainty prevent displacement.
    source_ids:
      - rklb_q1_2026
      - asts_q1_2026
      - yss_solestial_closing_8ka_2026_06_04
      - voyg_astrobotic_acquisition_8k_2026_06_04
    investment_implication: Keep RKLB as best-ranked but do not chase above cap; keep ASTS small because binary risk remains high.
  who_can_monetize_into_shareholder_value:
    facts: RKLB has current revenue, backlog, liquidity, and defense-space contract evidence. ASTS has high potential but still needs launch, regulatory, and commercial proof.
    inferences: RKLB deserves priority when price discipline allows; ASTS deserves only a small optionality sleeve.
    disconfirming_evidence: Both companies remain high-multiple and dilution-sensitive.
    source_ids:
      - rklb_q1_2026
      - asts_q1_2026
      - market_quote_snapshot_2026_06_05
    investment_implication: Partial deployment beats full deployment; current RKLB price prevents a fresh public buy-zone row.
  public_security_expression:
    facts: RKLB and ASTS are U.S.-listed common stocks and policy-eligible; watch, research-only, raw, and not-tradable names cannot receive buy recommendations without promotion or public tradability.
    inferences: The actionable candidate set is limited to current policy-eligible public securities after freshness and entry gates.
    disconfirming_evidence: Some raw leads are policy-ineligible, generic, or weak proxies.
    source_ids:
      - sec_company_tickers_exchange_2026_06_05
      - sec_event_filing_index_2026_06_05
    investment_implication: Do not use private, OTC, fund, or token substitutes for the satellite objective.
  early_small_misunderstood_or_newly_public:
    facts: YSS, FLY, VOYG, and XNDU already add newer public coverage, while QTEX and MDA remain future backlog.
    inferences: Peer-map completeness improved, but no newly public name clears mission, evidence, and entry gates today.
    disconfirming_evidence: Offering, ATM, resale, acquisition, control, and short-record risks are material.
    source_ids:
      - yss_solestial_closing_8ka_2026_06_04
      - voyg_astrobotic_acquisition_8k_2026_06_04
      - sec_company_tickers_exchange_2026_06_05
    investment_implication: Keep future readiness work active without delaying the current simulation conclusion.

