first_layer_discovery_questions:
  - What could become scarce or strategically constrained over the next decade?
  - Who controls, owns, enables, or can remove that scarcity?
  - Who can convert the scarcity into pricing power, reinvestment paths, and
    shareholder value?
  - Is there a public security that directly expresses that exposure under the
    current policy?
  - Is the public company early, small, misunderstood, newly listed, awkward, or
    underfollowed enough to support extreme asymmetric upside?
specific_question: Reassess all current holdings and research symbols after
  August 5 closes and material filings, with special focus on whether MDA
  remains actionable when the prior owner order state is unconfirmed.
safety_boundaries:
  - Do not execute trades.
  - Do not mutate confirmed account files.
  - Use repository files and fresh public sources as evidence; separate facts
    from inferences.
  - Treat deterministic discovery as scaffolding, not buy eligibility.
  - Classify gaps as target-critical, opportunity-set-critical, bounded
    discovery debt, or repository-health debt.
  - Compare zero with the smallest mission-consistent staged exposure before
    finalizing no action with deployable liquidity.
  - R1 and R2 candidates may remain open under dated service levels; R3 carries
    promotion-grade and dashboard-equivalent requirements.
