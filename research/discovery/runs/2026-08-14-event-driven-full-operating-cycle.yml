first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Energized AI-ready sites, GPU clusters, high-speed optical inputs, autonomous defense systems, strategic materials and spacecraft capacity remain plausible bottlenecks.
    inferences: Common equity captures scarcity only when contracts, project finance, dilution and reinvestment leave durable per-share economics.
    disconfirming_evidence: Most early leads remain acquisition-shaped, capital intensive, diluted or customer concentrated.
    source_ids: [iren_horizon1_acceptance_2026_08_13, axti_q2_2026_10q, onds_q2_2026_10q]
    investment_implication: Use only the smallest IREN starter; retain new leads under SLA.
  who_controls_or_removes_scarcity:
    facts: IREN controls energized sites and delivered GPU infrastructure; MDA controls spacecraft capability; AXTI supplies InP; ONDS and RCAT supply autonomous systems.
    inferences: IREN now has the best current non-space evidence-to-denominator balance.
    disconfirming_evidence: IREN still lacks disclosed GAAP cash returns and every early challenger retains capital-structure blockers.
    source_ids: [iren_horizon1_acceptance_2026_08_13, completed_close_universe_2026_08_13]
    investment_implication: Promote IREN and cap the current action at five shares.
  who_can_monetize_into_shareholder_value:
    facts: IREN has a five-year Microsoft contract and first accepted deployment; other new leads have earlier or less bounded evidence.
    inferences: Starter-level value capture is plausible before scale-level economics are proven.
    disconfirming_evidence: GPU depreciation, remaining capex, project debt, Mirantis economics and gross dilution can still absorb value.
    source_ids: [iren_horizon1_acceptance_2026_08_13]
    investment_implication: Cash-return uncertainty is sizing risk for 2.115 percent and decision-critical above it.
  public_security_expression:
    facts: Seventy-one securities have completed prices; OPENAI and ANTHROPIC are unlisted and XTND is pre-listing.
    inferences: Listing and price availability establish observability rather than buy eligibility.
    disconfirming_evidence: Seventeen open R1 and R2 names remain outside promotion and buy eligibility.
    source_ids: [completed_close_universe_2026_08_13, supplemental_R1_R2_closes_2026_08_13]
    investment_implication: Only IREN receives a nonzero proposal.
  early_small_misunderstood_or_newly_public:
    facts: MDA, GILT, APLD, BRUN, ALOY, RCAT, AXTI, LASR and other R1 and R2 records provide small or awkward expressions.
    inferences: Small denominators improve the right tail only when survival and per-share capture are credible.
    disconfirming_evidence: Each early lead retains contract, financing, concentration, commercialization or dilution blockers.
    source_ids: [brun_q1_2026_10q, aloy_q1_2026_10q_and_financing, rcat_q1_2026_10q_and_offering]
    investment_implication: Preserve the leads without using incomplete evidence as either buy signal or portfolio-wide veto.
