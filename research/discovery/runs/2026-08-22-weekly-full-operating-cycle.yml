article_one_offensive_challenge:
  strongest_counterfactual: LEU
  smallest_mission_consistent_exposure: Two whole shares at USD 186.26 would cost USD 372.52 and represent 3.3082 percent of research NAV.
  zero_vs_starter_result: Zero wins because funding, fixed-price cascade economics, TENEX replacement, expansion capital and dilution can change whether common equity captures positive value; a smaller one-share position falls below the recorded mission-consistent floor and does not solve the blocker.
  cash_opportunity_cost: Waiting can miss a nuclear-fuel rerating and leaves 78.0068 percent in cash, but a premature starter cannot bound adverse contract economics and would still lose to the existing IREN starter, GILT's cleaner small denominator, SGOV as cash management and full cash optionality.
  conjunctive_trigger: Funded and protected cascade economics, credible TENEX replacement and expansion capital, bounded fully diluted shares, positive per-share cash conversion, and a fresh valuation leaving exceptional upside must all be present.
  next_evidence_deadline: 2026-08-28
  conclusion: "Why buy reasons remain smaller than no-buy reasons: direct scarcity and theoretical right tail do not outweigh unbounded funded unit economics and the current equity denominator."
