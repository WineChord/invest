first_principles_heading: First-Principles Analysis
first_principles_analysis:
  question_rebuilt_from_basics: Which current public security can convert a scarce long-duration bottleneck into exceptional dilution-adjusted per-share value at a feasible portfolio weight and beat holdings, cash and all material alternatives now?
  irreducible_facts:
    - Confirmed cash is USD 8783.87 and confirmed holdings are ASTS 11, IREN 5, MDA 9 and RKLB 17.
    - Seventy-one listed securities have a completed August 21 close and the full 74-security universe was reviewed.
    - No target has a complete incremental bridge from scarcity and demand to after-capex, after-financing fully diluted per-share cash value.
  binding_constraints:
    - Mission, evidence, entry, survival, promotion and opportunity-cost gates must all pass before a nonzero quantity.
    - Uncertainty that can reverse residual common-equity value cannot be absorbed by a symbolic size or short validity window.
  causal_chain: Scarcity must create binding demand; demand must produce protected unit economics; cash returns must exceed capex, financing and dilution; residual per-share value and a feasible position must materially improve the portfolio relative to cash and alternatives.
  inherited_assumptions_challenged:
    - High cash weight or a lower price requires a trade.
    - Backlog, gross contracted revenue, strategic importance or a deployment milestone alone proves common-equity economics.
  value_capture_or_mission_link: Existing IREN, MDA, ASTS and RKLB starters preserve live right-tail exposure; the next dollar should move only when another security adds a stronger attainable per-share path rather than symbolic exposure or duplicated risk.
  disconfirming_evidence: Protected funded LEU cascade economics, positive IREN project cash returns, clean GILT post-Comtech cash conversion or limited-recourse APLD parent cash yield could reverse the current zero-increment conclusion.
  decision_consequence: Hold confirmed positions and cash; open no incremental quantity or executable limit before the named conjunctive evidence and a fresh valuation.
