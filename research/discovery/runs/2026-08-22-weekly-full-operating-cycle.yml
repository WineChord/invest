first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Qualified HALEU and TRISO fuel, energized AI-ready sites, sovereign quantum systems, optical interconnect capacity and autonomous deployment financing remain plausible long-duration bottlenecks.
    inferences: Scarcity matters to common equity only when qualification, binding demand, positive unit economics and bounded financing preserve per-share value.
    disconfirming_evidence: Current leaders remain capital intensive, pre-commercial, customer concentrated, richly valued or dilution dependent.
    source_ids: [stdn_radiant_supply_release_2026_08_20, apld_fy2026_10k, iqmx_h1_2026_results, enrd_h1_2026_results]
    investment_implication: Keep LEU, IREN, GILT and APLD at the top of the next-dollar research queue without opening a new order.
  who_controls_or_removes_scarcity:
    facts: LEU and STDN most directly express fuel capacity; IREN and APLD control energized campuses; IQMX and QNT sell full-stack quantum systems; photonics issuers supply high-speed links.
    inferences: Direct control is stronger than a thematic proxy but still needs delivered economics and a survivable denominator.
    disconfirming_evidence: No newly strengthened issuer disclosed a complete project-to-parent cash-return and dilution bridge.
    source_ids: [stdn_radiant_supply_release_2026_08_20, apld_fy2026_10k, qnt_q2_2026_results, iqmx_h1_2026_results]
    investment_implication: IREN's confirmed starter remains the best bounded powered-compute expression; additions remain zero.
  who_can_monetize_into_shareholder_value:
    facts: IREN has accepted Horizon 1; LEU has strategic backlog; GILT has current demand; APLD has long leases; each still lacks a decision-grade incremental per-share cash bridge.
    inferences: The binding constraint is residual common-equity capture after capex, debt, integration and dilution rather than demand headlines.
    disconfirming_evidence: A protected funded cascade, positive project cash returns, clean transaction close or limited-recourse campus refinancing would change the ranking.
    source_ids: [apld_fy2026_10k, gilt_peru_broadband_2026_08_17, completed_close_universe_2026_08_21]
    investment_implication: Cash wins the next dollar while existing starters preserve live exposure.
  public_security_expression:
    facts: Seventy-one securities have current completed closes; OPENAI and ANTHROPIC remain unlisted and XTND remains pre-listing.
    inferences: Observability and policy eligibility do not establish promotion or buy eligibility.
    disconfirming_evidence: A completed listing plus current filing, valuation and promotion work could change a not-tradable conclusion.
    source_ids: [completed_close_universe_2026_08_21, supplemental_R1_R2_closes_2026_08_21]
    investment_implication: No unavailable price is estimated and no pre-listing candidate receives a quantity.
  early_small_misunderstood_or_newly_public:
    facts: GILT, APLD, STDN, IQMX, ENRD and the open R1 or R2 set provide smaller or awkward direct expressions.
    inferences: A small denominator enlarges the right tail only when survival, customer economics and dilution-adjusted capture are credible.
    disconfirming_evidence: Financing, losses, capital stacks or missing unit economics dominate every early challenger today.
    source_ids: [gilt_peru_broadband_2026_08_17, apld_fy2026_10k, stdn_radiant_supply_release_2026_08_20, enrd_h1_2026_results]
    investment_implication: Retain dated evidence work and false-negative triggers without promoting an incomplete lead.
