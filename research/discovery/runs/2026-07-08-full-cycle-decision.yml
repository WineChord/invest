first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Launch cadence, responsive space, LEO communications, direct-to-device capacity, AI interconnect bandwidth, AI power, nuclear fuel, and AI cloud capacity remain plausible bottlenecks.
    inferences: RKLB and ASTS remain the best current public holding expressions; LEU improved but still needs promotion; SPCX is the strongest absolute platform but not the best current entry.
    disconfirming_evidence: RKLB merger financing deterioration, ASTS on-orbit failure, LEU contract execution failure, SPCX valuation reset, or a broad liquidity shock would force a rerun.
    source_ids:
      - rklb_iridium_merger_2026_06_29
      - asts_bluebird_8_10_launch_2026_06_17
      - leu_haleu_contract_2026_07_02
    investment_implication: Keep unexpired action details private and preserve optionality until broker-side facts and current evidence are checked.
  who_controls_or_removes_scarcity:
    facts: Rocket Lab may gain Iridium network and spectrum control; ASTS controls a high-risk direct-to-device architecture; Centrus has a DOE-backed HALEU role; SpaceX controls the strongest cross-lane platform.
    inferences: Scarcity control improved for RKLB and LEU, but only RKLB is already promoted and buy-zone-adjacent under current policy.
    disconfirming_evidence: Approval delays, financing stress, dilution, or failed operational milestones would reduce the control thesis.
    source_ids:
      - rklb_iridium_merger_2026_06_29
      - leu_haleu_contract_2026_07_02
      - spcx_notes_closing_2026_06_26
    investment_implication: Keep LEU and SPCX below promotion/entry eligibility in the public record and keep any current RKLB allocation conclusion private.
  who_can_monetize_into_shareholder_value:
    facts: RKLB has operating space execution plus a pending network acquisition; ASTS has high convexity if direct-to-device scales; MU and CRDO show strong AI infrastructure economics but with scale, cycle, or concentration drawbacks.
    inferences: Marginal capital still favors RKLB first and ASTS second, but not at full-cash size.
    disconfirming_evidence: Neutron delay, ASTS financing or service-economics failure, CRDO concentration worsening, or memory-cycle reversal would change ranking.
    source_ids:
      - alpaca_delayed_sip_snapshot_2026_07_07
      - mu_q3_fy2026_10q
      - crdo_10k_fy2026
    investment_implication: Keep the private allocation conclusion conservative and withhold unexpired execution details from public records.
  public_security_expression:
    facts: Current policy permits U.S.-listed common stocks and approved Treasury reserve ETFs; watch, research-only, and not-tradable rows cannot receive buys without the required promotion path.
    inferences: LEU, SPCX, SNDK, and lower-status names cannot bypass promotion or readiness gates.
    disconfirming_evidence: Broker restrictions, quote gaps, or new filings before any private action require rerun.
    source_ids:
      - sec_event_filing_index_2026_07_08
      - sndk_primary_skim_2026_07_08
    investment_implication: Lower-status names and SGOV do not receive a published current-cycle order in this public record.
  early_small_misunderstood_or_newly_public:
    facts: RKLB and ASTS remain smaller and more volatile than mature AI infrastructure names; CBRS and SNDK are newly public but not yet better allocation candidates; SPCX is newly public but very large and complex.
    inferences: The current private allocation review remains centered on existing highest-conviction holdings rather than a new candidate jump.
    disconfirming_evidence: A thesis-preserving price reset or new primary evidence could justify future promotion review.
    source_ids:
      - cbrs_q1_2026_10q
      - sndk_primary_skim_2026_07_08
      - spcx_notes_closing_2026_06_26
    investment_implication: Keep discovery running while withholding any unexpired allocation conclusion from committed public records.

