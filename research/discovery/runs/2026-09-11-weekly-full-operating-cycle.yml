first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Deployable multi-band ground communications, domestic nuclear fuel, energized AI sites, strategic heavy-rare-earth processing, optical links and sovereign quantum systems remain plausible long-duration bottlenecks.
    inferences: Scarcity matters only when funded demand, delivery, protected economics and bounded dilution preserve per-share value.
    disconfirming_evidence: Capital intensity, customer concentration, technical failure, financing claims or substitution can prevent scarcity from reaching common shareholders.
    source_ids: [gilt_us_defense_order_2026_09_09, leu_radiant_haleu_contract_2026_09_09, usar_serra_verde_close_2026_09_04, xndu_canada_support_2026_08_28]
    investment_implication: GILT has the strongest current bounded entry; strategic critical materials enters the lane map without creating a buy.
  who_controls_or_removes_scarcity:
    facts: GILT supplies ground and defense communications; LEU and STDN express nuclear-fuel capacity; IREN and APLD control powered sites; USAR targets mine-to-magnet capacity; quantum and optical issuers address other constrained layers.
    inferences: Direct control is valuable only if delivery and financing preserve residual common-equity value.
    disconfirming_evidence: Unprotected contracts, weak cash conversion, excessive capex or dilution can transfer the value away from shareholders.
    source_ids: [gilt_comtech_2026_06_15, leu_radiant_haleu_contract_2026_09_09, usar_serra_verde_close_2026_09_04]
    investment_implication: Start GILT at the minimum weight and keep every other incremental quantity at zero.
  who_can_monetize_into_shareholder_value:
    facts: GILT has profitable standalone operations, acquired-segment operating profit, funded closing capacity and a current defense order; competing candidates lack one or more protected-economics, survival or entry elements.
    inferences: GILT can plausibly convert the bottleneck into per-share value, but only a two-percent starter is underwritten before combined cash conversion.
    disconfirming_evidence: Adverse closing terms, customer loss, margin compression, negative cash conversion or unexpected dilution would invalidate the starter or block scale.
    source_ids: [gilt_q2_2026_results, gilt_comtech_2026_06_15, gilt_convert_close_2026_09_08, gilt_us_defense_order_2026_09_09]
    investment_implication: Recommend exactly 29 GILT shares at no more than USD 9.60 for one session.
  public_security_expression:
    facts: Seventy-two securities are listed, seventy-one have a reliable completed September 10 close, and OPENAI and ANTHROPIC remain unlisted research references.
    inferences: Listing and observability do not create eligibility; current promotion and buy-zone gates still control.
    disconfirming_evidence: A listed security with current filings, valuation and promotion work could displace the current ordering.
    source_ids: [completed_close_universe_2026_09_10, sec_event_index_full_universe_2026_09_11]
    investment_implication: GILT alone enters the current buy zone; XTND remains R1 without a reliable close.
  early_small_misunderstood_or_newly_public:
    facts: GILT, STDN, OCC, XNDU, USAR, QNT and XTND provide smaller, awkward or newly public direct expressions, while GILT alone has sufficient current operating and entry evidence.
    inferences: A small denominator enlarges the right tail only when survival, customer economics and dilution-adjusted capture are credible.
    disconfirming_evidence: A stronger lower-stage cash bridge or a failure in GILT's current bridge would reorder the set.
    source_ids: [gilt_q2_2026_results, stdn_q2_2026_10q, occ_q3_fy2026_10q, xndu_canada_support_2026_08_28]
    investment_implication: Preserve dated lower-stage service levels while funding only the bounded GILT starter.
