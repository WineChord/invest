first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Launch cadence, orbital logistics, satellite-to-phone capacity, AI compute capacity, power/cooling infrastructure, interconnect bandwidth, and regulated digital distribution remain candidate bottlenecks.
    inferences: SPCX is now a direct public expression of several bottlenecks, but its size and first-day valuation make it a high-quality opportunity-cost reference rather than a first-day buy.
    disconfirming_evidence: If SPCX post-IPO reporting shows weaker Starlink economics, xAI/X losses consume more capital, or public shareholders have poor governance protection, direct SpaceX exposure may be structurally unattractive.
    source_ids:
      - spcx_424b4_2026_06_12
      - spcx_final_pricing_fwp_2026_06_11
      - sec_event_filing_index_2026_06_12
    investment_implication: Update the lane map to public SPCX and keep staged buying focused on smaller public candidates with better current entry.
  who_controls_or_removes_scarcity:
    facts: SpaceX controls Starlink, launch scale, and related AI-adjacent infrastructure; RKLB controls a smaller integrated launch and space-systems platform; ASTS controls a higher-risk direct-to-device satellite architecture.
    inferences: SPCX raises the opportunity-cost bar for RKLB and ASTS, but also validates the structural scarcity of space infrastructure and satellite connectivity.
    disconfirming_evidence: RKLB execution failures, ASTS regulatory or deployment setbacks, or SPCX aggressive pricing could weaken smaller public proxies.
    source_ids:
      - spcx_424b4_2026_06_12
      - market_quote_snapshot_2026_06_12
      - sec_event_filing_index_2026_06_12
    investment_implication: Keep RKLB as the main staged add, ASTS as a smaller convexity sleeve, and SPCX as watch-only.
  who_can_monetize_into_shareholder_value:
    facts: SpaceX has the deepest platform but came public at mega-cap scale and disclosed controlled-company governance and xAI/X loss exposure; RKLB and ASTS remain smaller and more option-like.
    inferences: Expected upside per dollar is currently more favorable in staged RKLB and tiny ASTS exposure than in first-day SPCX buying.
    disconfirming_evidence: If RKLB/ASTS dilution or execution risk worsens while SPCX trades down after lockup/float clarity, the ranking should be reopened.
    source_ids:
      - spcx_424b4_2026_06_12
      - spcx_market_quote_2026_06_12
      - market_quote_snapshot_2026_06_12
    investment_implication: Do not chase SPCX; leave enough cash to revisit after post-IPO evidence.
  public_security_expression:
    facts: SPCX Class A common stock is now registered and listed; RKLB, ASTS, CRDO, ALAB, and VRT remain eligible U.S.-listed common stocks under policy v1.1.
    inferences: Tradability alone is not buy eligibility; SPCX requires readiness and promotion before allocation.
    disconfirming_evidence: Any broker inability to trade the security, unexpected fee, settlement restriction, or material post-cycle filing blocks execution.
    source_ids:
      - spcx_8a_2026_06_10
      - spcx_final_pricing_fwp_2026_06_11
      - market_quote_snapshot_2026_06_12
    investment_implication: SPCX can be monitored as a public symbol, but no SPCX buy order should be placed this cycle.
  early_small_misunderstood_or_newly_public:
    facts: SPCX is newly public but not small; RKLB and ASTS are smaller, more volatile, and less mature public expressions of space bottlenecks.
    inferences: Newly public status increases SPCX monitoring priority but does not overcome valuation and governance risk.
    disconfirming_evidence: If SPCX sells off into a materially better valuation or new disclosures de-risk governance and xAI/X exposure, a promotion review is warranted.
    source_ids:
      - spcx_market_quote_2026_06_12
      - spcx_424b4_2026_06_12
      - community_triage_2026_06_12
    investment_implication: Add SPCX to dashboard-visible watch coverage and keep current private orders focused on RKLB/ASTS.

