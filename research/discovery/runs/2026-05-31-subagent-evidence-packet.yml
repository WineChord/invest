  reasoning_level: xhigh
  independent_context: true
  roles:
    - discovery_lane_candidate_triage
    - freshness_filing_review
    - bull_case
    - bear_case
    - allocation_risk
  do_not_fork_full_history_unless_needed: true
first_layer_discovery_questions:
  - What could become scarce or strategically constrained over the next decade?
  - Who controls, owns, enables, or can remove that scarcity?
  - Who can convert the scarcity into pricing power, reinvestment paths, and
    shareholder value?
  - Is there a public security that directly expresses that exposure under the
    current policy?
  - Is the public company early, small, misunderstood, newly listed, awkward, or
    underfollowed enough to support extreme asymmetric upside?
specific_question: Review discovery lanes, raw candidates, freshness, valuation,
  and opportunity cost for the current repository-public decision state.
safety_boundaries:
  - Do not execute trades.
  - Do not mutate broker-confirmed account files.
  - Use repository files and fresh public sources as evidence; separate facts
    from inferences.
  - Treat deterministic discovery as scaffolding, not buy eligibility.
  - Classify reachable evidence gaps before returning; do not leave
    repository-public readiness incomplete.
  - Material completed or incubated candidates need the full research-only
    dashboard surface before the repository is ready.
