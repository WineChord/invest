discovery_lane_summary:
  - id: space_infrastructure
    name: Space Infrastructure
    status: active
    bottleneck_thesis: Launch cadence, orbital logistics, spacecraft manufacturing,
      space systems, and government or commercial demand can become durable
      infrastructure bottlenecks.
    current_public_proxies:
      - RKLB
      - FLY
      - LUNR
      - RDW
      - KTOS
  - id: direct_to_device_connectivity
    name: Direct-To-Device Connectivity
    status: active
    bottleneck_thesis: Satellite-to-phone service could create a new global
      connectivity layer if spectrum, constellation capacity, mobile-network
      distribution, and regulation align.
    current_public_proxies:
      - ASTS
      - GSAT
      - SPACEX
  - id: ai_compute_infrastructure
    name: AI Compute Infrastructure
    status: active
    bottleneck_thesis: Training and inference demand can make compute capacity,
      deployment speed, power access, utilization, and financing discipline
      decisive constraints.
    current_public_proxies:
      - CRWV
      - NBIS
      - IREN
      - SPACEX
  - id: ai_power_and_cooling
    name: AI Data-Center Power And Cooling
    status: active
    bottleneck_thesis: AI data centers may be constrained by grid interconnection,
      onsite generation, thermal management, power electronics, and service
      capacity.
    current_public_proxies:
      - VRT
      - BE
      - OKLO
      - LEU
  - id: semiconductor_interconnect_and_memory
    name: Semiconductor Interconnect And Memory
    status: active
    bottleneck_thesis: AI system scaling can be limited by memory bandwidth,
      interconnect, retimers, optical or copper links, and rack-scale
      connectivity.
    current_public_proxies:
      - CRDO
      - ALAB
      - MU
  - id: advanced_nuclear_and_grid_constraints
    name: Advanced Nuclear And Grid Constraints
    status: active
    bottleneck_thesis: AI, industrial electrification, and energy security can make
      dispatchable power, nuclear fuel, licensing, and grid access strategic
      constraints.
    current_public_proxies:
      - OKLO
      - LEU
      - BE
  - id: quantum_computing_and_networking
    name: Quantum Computing And Networking
    status: active
    bottleneck_thesis: Quantum computing, networking, sensing, or security may
      become a new infrastructure layer if commercial usefulness emerges.
    current_public_proxies:
      - IONQ
  - id: programmable_money_infrastructure
    name: Programmable Money Infrastructure
    status: active
    bottleneck_thesis: Regulated stablecoin and programmable-money networks could
      become internet-scale financial infrastructure if distribution, reserves,
      compliance, and developer utility compound.
    current_public_proxies:
      - CRCL
  - id: frontier_ai_public_platforms
    name: Future Public Frontier AI Platforms
    status: active
    bottleneck_thesis: Frontier AI platforms may become application, infrastructure,
      and distribution layers if compute, data, product adoption, and capital
      access reinforce each other.
    current_public_proxies:
      - OPENAI
      - ANTHROPIC
      - SPACEX
  - id: unknown_future_bottlenecks
    name: Unknown Future Bottlenecks
    status: emerging
    bottleneck_thesis: The next multi-decade asymmetric opportunity may come from a
      category not yet represented in the watchlist or current lane map.
    current_public_proxies: []
