first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Grid-connected power, commissioned compute, AI interconnect, launch and spacecraft production, spectrum, nuclear fuel, cryogenic connectivity, and validated autonomous-freight deployment remain plausible constraints.
    inferences: Scarcity creates shareholder value only when delivery, pricing, margin, financing, and diluted per-share cash generation are auditable.
    disconfirming_evidence: ENRD, STDN, QTEX and many peers capitalize future scarcity before repeatable gross profit or free cash flow exists.
    source_ids: [completed_close_universe_2026_07_21, enrd_f1_2026_07_08, stdn_facility_milestones_2026_07_22, qtex_equity_overhang_2026_07_21]
    investment_implication: Preserve cash until evidence and entry align.
  who_controls_or_removes_scarcity:
    facts: Current lane leaders own or coordinate direct power, compute, interconnect, space, spectrum, fuel-cycle, quantum, or autonomy capabilities.
    inferences: Direct exposure is insufficient when customers, lenders, regulators, partners, warrants, or dilution capture most economics.
    disconfirming_evidence: Every current security retains an evidence, entry, survival, promotion, concentration, or opportunity-cost veto.
    source_ids: [sec_submissions_all_forms_2026_07_22, enrd_f1_2026_07_08, uec_q3_2026_10q]
    investment_implication: Research priority may change without creating buy eligibility.
  who_can_monetize_into_shareholder_value:
    facts: IREN, LEU, CRDO, GILT and MDA remain the closest research queue, while ENRD lacks proven positive gross economics.
    inferences: Confirmed cash has better option value than unreconciled long-duration economics or additional correlated space exposure.
    disconfirming_evidence: Accepted revenue, contract economics, free cash flow, capitalization repair, or a thesis-preserving valuation reset could change the ranking.
    source_ids: [completed_close_universe_2026_07_21, enrd_f1_2026_07_08, stdn_facility_milestones_2026_07_22]
    investment_implication: Retain confirmed cash and buy zero.
  public_security_expression:
    facts: Fifty watchlist symbols are tradable, OPENAI and ANTHROPIC are not, and XTND is not yet a policy-eligible listed security.
    inferences: A ticker, low nominal price, registration filing, proposed listing, or sharp decline does not create buy eligibility.
    disconfirming_evidence: ENRD is tradable and direct yet still fails survival and entry; XTND has operating evidence but no current security.
    source_ids: [completed_close_universe_2026_07_21, enrd_nasdaq_listing_2026_06_10, enrd_f1_2026_07_08]
    investment_implication: All current new-buy quantities are zero.
  early_small_misunderstood_or_newly_public:
    facts: ENRD and XTND are newly listed or pre-listing enough to be missed by static watchlists; UEC is mature and already multi-billion-dollar scale.
    inferences: Complexity requires complete readiness and explicit classification rather than automatic purchase or permanent dismissal.
    disconfirming_evidence: ENRD's operating and capital fragility, XTND's listing gap, and UEC's weak per-share asymmetry overwhelm current entry cases.
    source_ids: [enrd_f1_2026_07_08, enrd_nasdaq_listing_2026_06_10, uec_q3_2026_10q]
    investment_implication: Incubate ENRD, reject UEC, retain XTND as not tradable, and allocate zero.

