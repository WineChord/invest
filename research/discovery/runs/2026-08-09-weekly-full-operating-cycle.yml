first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Spacecraft and payload capacity, HALEU, energized AI-ready land, autonomous defense systems, high-speed compound-semiconductor substrates and long-duration grid storage remain plausible long-horizon bottlenecks.
    inferences: A bottleneck creates shareholder asymmetry only if common equity captures pricing, reinvestment and per-share economics after funding, acquisition and dilution.
    disconfirming_evidence: Many newly surfaced issuers depend on construction debt, related-party demand, government research, acquisitions or repeated securities issuance.
    source_ids: [sec_event_index_full_universe_2026_08_09, new_r1_primary_evidence_2026_08_09]
    investment_implication: Keep MDA first for near-term scale review and advance APLD to the highest-priority new R1, while all six new leads remain quantity zero.
  who_controls_or_removes_scarcity:
    facts: MDA builds spacecraft and payload systems; APLD controls powered campuses; ONDS integrates autonomous defense systems; AXTI and ALMU address compound-semiconductor inputs; SATL owns an earth-observation constellation; EOSE manufactures zinc storage systems.
    inferences: Asset or technology control is insufficient where customers, lenders, acquisition counterparties or security holders capture most economics.
    disconfirming_evidence: Cash conversion, financing, concentration, commercial scale and fully diluted capitalization remain unresolved for the new R1 set and for MDA scaling.
    source_ids: [mda_q2_2026_results, new_r1_primary_evidence_2026_08_09]
    investment_implication: Retain current positions and complete bounded R2 work before any new candidate promotion or MDA scale-up.
  who_can_monetize_into_shareholder_value:
    facts: MDA produced the strongest current revenue, booking and backlog evidence; APLD has the largest new contracted powered-site base; GILT has the smallest established operating denominator; LEU controls the strongest strategic fuel-cycle bottleneck.
    inferences: Current business quality and bottleneck fit do not automatically produce attractive dilution-adjusted entry economics.
    disconfirming_evidence: MDA free cash flow was negative, APLD funding and concentration are heavy, GILT cash conversion is weak and LEU's valuation and conditional backlog remain demanding.
    source_ids: [mda_q2_2026_results, new_r1_primary_evidence_2026_08_09, completed_close_universe_2026_08_07]
    investment_implication: The next-dollar queue is MDA, GILT, LEU, APLD and IREN, with SEI immediately behind; none has a current executable limit.
  public_security_expression:
    facts: Fifty-four watchlist securities and seven additional listed research leads have completed prices; OPENAI and ANTHROPIC are unlisted and XTND remains pre-listing.
    inferences: Listing and price availability establish observability, not mission, evidence, promotion or entry eligibility.
    disconfirming_evidence: Six new listed leads remain at R1 and VIP remains R1; none has complete R2 comparison or promotion evidence.
    source_ids: [completed_close_universe_2026_08_07, new_r1_primary_evidence_2026_08_09]
    investment_implication: Keep all new candidates at quantity zero and preserve direct not-tradable labels for unavailable securities.
  early_small_misunderstood_or_newly_public:
    facts: GILT, MDA, APLD, ONDS, AXTI, ALMU, SATL, EOSE, VIP and XTND remain small, early, awkward, recently re-rated or incompletely covered expressions.
    inferences: Small denominators improve right-tail potential only when survival, directness and per-share value capture are credible.
    disconfirming_evidence: The new R1 names retain leverage, dilution, concentration, commercialization, customer or related-party blockers; MDA is already at the research ceiling.
    source_ids: [completed_close_universe_2026_08_07, new_r1_primary_evidence_2026_08_09, mda_q2_2026_results]
    investment_implication: Complete APLD R2 first, then ONDS and the compound-semiconductor leads; keep SATL and EOSE lower in the evidence queue.

