first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: HALEU, spacecraft manufacturing and payload capacity, satellite-ground defense communications, energized AI-ready sites, high-speed interconnect, quantum fabrication and water-transmission capacity remain plausible bottlenecks.
    inferences: Scarcity matters only when listed common equity can retain pricing and reinvestment economics after funding, fixed-price obligations, acquisition costs and dilution.
    disconfirming_evidence: Many public proxies capitalize scarcity before contracts, cash conversion and per-share capture are proved.
    source_ids: [completed_close_universe_2026_08_05, sec_event_index_targeted_2026_08_06]
    investment_implication: Keep MDA first in the configuration queue, but do not issue a new action until the prior MDA order state is known.
  who_controls_or_removes_scarcity:
    facts: MDA manufactures spacecraft and payloads, LEU controls the strongest listed U.S. enrichment path, GILT owns satellite-ground capabilities, IREN controls powered sites and enterprise orchestration, and IONQ now owns SkyWater.
    inferences: Asset control is insufficient when counterparties, lenders, integration costs, warrants or repeated issuance capture the economics.
    disconfirming_evidence: GILT cash conversion, LEU funded fixed-price economics, IREN acquired economics and IONQ post-close unit economics remain incomplete or weak.
    source_ids: [sec_event_index_targeted_2026_08_06, gilt_q2_2026_results, leu_q2_2026_results, ionq_q2_2026_results]
    investment_implication: Retain target-specific zero for GILT LEU IREN and IONQ; MDA remains economically position-sizeable but operationally blocked by broker-state ambiguity.
  who_can_monetize_into_shareholder_value:
    facts: MDA has the most balanced platform and materially expanded contract, GILT the smallest profitable denominator, LEU the strongest mission fit, IREN the strongest powered-site option and IONQ the newest integrated strategic path.
    inferences: The best business is not automatically the best dilution-adjusted per-share asymmetry.
    disconfirming_evidence: Each leader retains contract-margin, cash-conversion, integration, capitalization, concentration or financing risk.
    source_ids: [completed_close_universe_2026_08_05, sec_event_index_targeted_2026_08_06, gilt_q2_2026_results, leu_q2_2026_results, ionq_q2_2026_results]
    investment_implication: MDA remains the strongest candidate, but zero new quantity beats a potentially duplicate action until the owner resolves the prior order state.
  public_security_expression:
    facts: Fifty-four current research securities have eligible completed closes; OPENAI and ANTHROPIC are unlisted, XTND is pre-listing, and VIP is an R1 listed lead without current reliable continuous price coverage.
    inferences: Tradability and nominal price do not establish buy eligibility.
    disconfirming_evidence: VIP lacks survivable financing, customer and capitalization evidence; XTND lacks a completed eligible listing.
    source_ids: [completed_close_universe_2026_08_05, sec_event_index_targeted_2026_08_06]
    investment_implication: No new security enters the current configuration queue.
  early_small_misunderstood_or_newly_public:
    facts: GILT MDA NWPX OCC QSI ASPI STDN ENRD VIP and XTND remain small, early, awkward or newly public expressions.
    inferences: A small denominator helps only when survival, directness and shareholder-value capture are credible.
    disconfirming_evidence: GILT awaits transaction and cash-conversion evidence, NWPX lacks proved extreme reinvestment economics, VIP lacks a binding customer and XTND remains pre-listing.
    source_ids: [sec_event_index_targeted_2026_08_06, mda_telesat_expansion_2026_08_04]
    investment_implication: MDA stays first in research priority; retain GILT as the closest low-denominator challenger and VIP as bounded R1 only.

