first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: HALEU, energized AI-ready power, high-speed interconnect, launch capacity, spacecraft production, spectrum, and water-transmission capacity remain plausible bottlenecks.
    inferences: Scarcity matters only when listed common equity can retain pricing and reinvestment economics after funding and dilution.
    disconfirming_evidence: Current public proxies often capitalize scarcity before contracts, cash conversion, and per-share capture are proved.
    source_ids: [completed_close_universe_2026_07_30, sec_submissions_all_forms_2026_07_31]
    investment_implication: Keep GILT LEU MDA IREN and CRDO as the dated next-dollar queue.
  who_controls_or_removes_scarcity:
    facts: LEU controls the strongest listed U.S. enrichment path, GILT owns satellite-ground capabilities, and IREN controls power sites with AI-compute optionality.
    inferences: Asset control is insufficient when customers lenders counterparties warrants or repeated issuance capture the economics.
    disconfirming_evidence: LEU fixed-price terms, GILT transaction economics, and IREN accepted revenue remain incomplete.
    source_ids: [sec_submissions_all_forms_2026_07_31]
    investment_implication: Require sign-changing evidence before scaling or initiating.
  who_can_monetize_into_shareholder_value:
    facts: GILT has the smallest current denominator, LEU the strongest mission fit, MDA the most balanced direct platform, IREN the greatest power-site option, and CRDO the strongest operating quality.
    inferences: The best business is not automatically the best per-share asymmetry.
    disconfirming_evidence: Each leader retains a target-specific evidence entry or value-capture blocker.
    source_ids: [completed_close_universe_2026_07_30, sec_submissions_all_forms_2026_07_31]
    investment_implication: Compare zero with a 24-share GILT starter and expire the wait on August 5.
  public_security_expression:
    facts: Fifty-four current research securities have eligible completed closes; OPENAI and ANTHROPIC are not listed and XTND is pre-listing.
    inferences: Tradability and nominal price do not establish buy eligibility.
    disconfirming_evidence: VIP remains R1 with insufficient financing customer and survival evidence.
    source_ids: [completed_close_universe_2026_07_30, sec_submissions_all_forms_2026_07_31]
    investment_implication: No new security enters a current buy zone.
  early_small_misunderstood_or_newly_public:
    facts: GILT NWPX OCC QSI ASPI STDN ENRD VIP and XTND remain small early awkward or newly public expressions.
    inferences: A small denominator helps only when survival directness and shareholder value capture are credible.
    disconfirming_evidence: NWPX lacks proved extreme reinvestment economics and VIP lacks a binding AI customer and stable capitalization.
    source_ids: [nwpx_q2_2026_10q, sec_submissions_all_forms_2026_07_31]
    investment_implication: Keep GILT nearest to entry and NWPX as a stronger research comparator.

