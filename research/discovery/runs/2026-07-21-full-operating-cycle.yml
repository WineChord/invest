first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Grid-connected power, commissioned GPU capacity, AI interconnect, launch and spacecraft production, spectrum, HALEU and TRISO fuel, cryogenic quantum connectivity, and field-proven edge autonomy remain plausible bottlenecks.
    inferences: Scarcity becomes shareholder value only when delivery, pricing, margins, financing and diluted per-share cash generation are auditable.
    disconfirming_evidence: Many current prices and financing structures capitalize future scarcity before recognized revenue or free cash flow exists.
    source_ids: [completed_close_universe_2026_07_20, iren_contract_update_2026_07_20, qtex_f3_2026_06_04, xtnd_s4a_2026_07_16]
    investment_implication: Preserve cash until evidence and entry align.
  who_controls_or_removes_scarcity:
    facts: Current lane leaders own direct power, compute, interconnect, space, spectrum, fuel-cycle, quantum or autonomy capabilities.
    inferences: Direct control is necessary but insufficient if lenders, customers, regulators, partners, contingent claims or dilution capture the economics.
    disconfirming_evidence: Every security retains a current evidence, entry, survival, promotion or opportunity-cost veto.
    source_ids: [sec_submissions_all_forms_2026_07_21, iren_contract_update_2026_07_20, qtex_f3_2026_06_04]
    investment_implication: Raise research priority only where new evidence warrants it; do not infer buy eligibility.
  who_can_monetize_into_shareholder_value:
    facts: IREN, GILT, LEU, CRDO and MDA are the nearest opportunity-cost set, but none clears all gates.
    inferences: Cash has better option value than buying unreconciled long-duration economics or adding correlated space risk.
    disconfirming_evidence: Accepted revenue, contract economics, free cash flow, integration proof, capitalization repair or a conjunctive valuation reset could change rankings.
    source_ids: [iren_contract_update_2026_07_20, mda_cls_financing_2026_07_20, completed_close_universe_2026_07_20]
    investment_implication: Retain confirmed cash and buy zero.
  public_security_expression:
    facts: Forty-nine watchlist symbols are tradable, OPENAI and ANTHROPIC are not, and XTND is not yet a policy-eligible listed security.
    inferences: A ticker, low nominal price, filing, proposed listing or sharp decline does not create buy eligibility.
    disconfirming_evidence: QTEX is tradable but still fails evidence, survival and entry; XTND has operating evidence but no current security.
    source_ids: [qtex_completed_close_2026_07_20, xtnd_425_2026_07_20, sec_registration_transaction_candidates_2026_07_20]
    investment_implication: All current new-buy quantities are zero.
  early_small_misunderstood_or_newly_public:
    facts: QTEX and XTND are small, awkward or pre-listing enough to be missed; ALP is a small compute pivot with a reported contract.
    inferences: Complexity justifies complete readiness and explicit classification, not automatic rejection or purchase.
    disconfirming_evidence: QTEX losses and dilution, ALP going-concern evidence, and XTND listing and earnout risk overwhelm current entry cases.
    source_ids: [qtex_f3_2026_06_04, alp_fy2026_annual_report, xtnd_s4a_2026_07_16]
    investment_implication: Incubate QTEX, reject ALP, retain XTND as not tradable, and allocate zero.

