first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Grid interconnection, rapid behind-the-meter power, AI cooling and optical bandwidth, launch, spectrum, nuclear fuel, qualified manufacturing, and financed compute remain plausible constraints.
    inferences: Scarcity creates shareholder value only when delivery, pricing power, margins, financing, and diluted per-share cash generation are auditable.
    disconfirming_evidence: Current prices and financing structures often capitalize future scarcity before free cash flow is proved.
    source_ids: [completed_close_universe_2026_07_17_refresh_2026_07_19, sei_q1_2026_10q, stdn_424b4_2026_07_16]
    investment_implication: Preserve cash until evidence and entry align.
  who_controls_or_removes_scarcity:
    facts: Existing lane leaders own or operate direct space, spectrum, interconnect, cooling, power, compute, and nuclear-fuel capabilities.
    inferences: Direct control is necessary but insufficient when lenders, customers, regulators, partners, or dilution capture the economics.
    disconfirming_evidence: Every current candidate retains at least one material concentration, financing, valuation, execution, or survival veto.
    source_ids: [sec_submissions_all_forms_2026_07_19, sei_q1_2026_10q, stdn_424b4_2026_07_16]
    investment_implication: Retain the current lane map and statuses without adding capital.
  who_can_monetize_into_shareholder_value:
    facts: GILT, LEU, MDA, SEI, NBIS, and STDN express different points on the proof-versus-upside spectrum, but none clears all current gates.
    inferences: Cash has better option value than paying for unverified long-duration common-share economics or adding to correlated space exposure.
    disconfirming_evidence: Integration, funded delivery, positive free cash flow, diversification, balance-sheet de-risking, or a conjunctive valuation reset could change the ranking.
    source_ids: [completed_close_universe_2026_07_17_refresh_2026_07_19, nbis_gpu_facility_2026_07_17, sei_q1_2026_10q]
    investment_implication: Reopen only after the named proof-and-price triggers.
  public_security_expression:
    facts: Forty-eight research symbols are directly tradable under current policy; OPENAI and ANTHROPIC are not.
    inferences: A listed ticker, lower nominal price, or newly indexed filing does not create buy eligibility.
    disconfirming_evidence: Direct public expressions can still fail evidence, entry, survival, promotion, or opportunity-cost gates.
    source_ids: [completed_close_universe_2026_07_17_refresh_2026_07_19, sec_submissions_all_forms_2026_07_19]
    investment_implication: All current new-buy quantities remain zero.
  early_small_misunderstood_or_newly_public:
    facts: STDN, SEI, and other open raw candidates remain early, newly public, complex, or underfollowed enough to deserve durable comparison.
    inferences: Complexity justifies complete readiness and monitoring rather than automatic rejection or purchase.
    disconfirming_evidence: Capitalization, debt, dilution, concentration, and cash-conversion risk materially weaken headline upside.
    source_ids: [stdn_424b4_2026_07_16, sei_q1_2026_10q, sec_submissions_all_forms_2026_07_19]
    investment_implication: Keep current coverage but allocate zero.

