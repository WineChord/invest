first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Qualified quantum systems, licensed nuclear designs and fuel, high-speed optical transceivers, launch capacity, satellite connectivity, AI compute, power, cooling, memory and interconnect remain plausible constraints.
    inferences: Qualified delivery and funded capacity matter more than headline technology labels.
    disconfirming_evidence: Large valuations can pre-price scarcity before durable shareholder economics exist.
    source_ids: [rgti_q1_2026_ir, smr_us460_nrc_approval_2025, aaoi_q1_2026_ir]
    investment_implication: Preserve the current top-level map and improve same-lane comparability without forcing a purchase.
  who_controls_or_removes_scarcity:
    facts: Rigetti ships a 108-qubit system, NuScale holds NRC design approval, and AAOI ships 800G products while expanding domestic capacity.
    inferences: These are direct exposures, but directness does not prove pricing power or attractive common-share economics.
    disconfirming_evidence: Small revenue, project uncertainty, cash burn, customer concentration and dilution can transfer value away from shareholders.
    source_ids: [rgti_q1_2026_10q, smr_q1_2026_10q, aaoi_q1_2026_10q]
    investment_implication: Add research-only dashboard coverage and require operating evidence plus valuation reset before promotion.
  who_can_monetize_into_shareholder_value:
    facts: AAOI has meaningful revenue but weak cash conversion; RGTI and SMR remain loss-making with minimal revenue relative to valuation.
    inferences: Current enterprise values require far more successful future scale than primary evidence supports today.
    disconfirming_evidence: Technical or funded-project milestones could accelerate demand and justify later repricing.
    source_ids: [rgti_q1_2026_10q, smr_q1_2026_10q, aaoi_q1_2026_10q]
    investment_implication: Buy zero across the new peer set while monitoring explicit evidence triggers.
  public_security_expression:
    facts: Thirty-nine research symbols are U.S.-listed and tradable under policy; OPENAI and ANTHROPIC remain private and not tradable.
    inferences: Tradability is necessary but not sufficient; security-level dilution and value capture remain decisive.
    disconfirming_evidence: A direct listed issuer can still be unattractive at the current capitalization.
    source_ids: [rgti_q1_2026_10q, smr_q1_2026_10q, aaoi_q1_2026_10q]
    investment_implication: Keep private issuers out and classify direct but unattractive public peers as research-only.
  early_small_misunderstood_or_newly_public:
    facts: RGTI SMR and AAOI broaden smaller direct-peer coverage, while recent listings and transactions remain visible elsewhere in the map.
    inferences: Underfollowed or awkward structures deserve research priority but not automatic entry.
    disconfirming_evidence: RGTI and AAOI already carry multi-billion-dollar capitalizations and SMR economics remain unbound.
    source_ids: [rgti_q1_2026_ir, smr_q1_2026_ir, aaoi_q1_2026_ir]
    investment_implication: Continue bottleneck-first discovery and demand both per-share economics and entry margin.

