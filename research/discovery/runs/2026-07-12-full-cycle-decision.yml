    - role: freshness_filing_review
      reasoning_level: xhigh
      independent_context: true
      completed: true
      inputs_used: [forced live SEC submissions index, prior filing reviews, issuer filings]
      sources_checked: [rgti_q1_2026_10q, smr_q1_2026_10q, aaoi_fab4_2026_07_01]
      facts_verified: No new SEC acceptance after the prior cutoff; new peer primary evidence is fully reviewed.
      stale_or_missing_evidence: Complete future issuer economics remain trigger evidence, not reachable current-work blockers.
      confidence: high
      key_findings: No freshness event changes current holding or candidate status.
    - role: bull_case
      reasoning_level: xhigh
      independent_context: true
      completed: true
      inputs_used: [evidence packet, latest prices, primary filings, account state]
      sources_checked: [yahoo_chart_close_2026_07_10, rgti_q1_2026_ir, smr_us460_nrc_approval_2025, aaoi_q1_2026_ir]
      facts_verified: Strategic bottlenecks remain real and the leading non-holding active candidate has credible scarcity evidence.
      stale_or_missing_evidence: Full fixed-price economics for the leading non-holding candidate remain issuer-unavailable.
      confidence: medium_high
      key_findings: Only a very small, strictly controlled private risk budget could be defended; no new peer qualifies.
    - role: bear_case
      reasoning_level: xhigh
      independent_context: true
      completed: true
      inputs_used: [all-symbol evidence packet, dilution and balance-sheet evidence, account concentration]
      sources_checked: [yahoo_chart_close_2026_07_10, rgti_q1_2026_10q, smr_q1_2026_10q, aaoi_q1_2026_10q]
      facts_verified: Existing holdings are concentrated and every new peer has a valuation, commercialization, financing, or dilution veto.
      stale_or_missing_evidence: none that additional current research can remove
      confidence: high
      key_findings: Hold both positions, sell zero, and prefer cash to all new peer purchases.
    - role: allocation_risk
      reasoning_level: xhigh
      independent_context: true
      completed: true
      inputs_used: [confirmed account state, bull and bear cases, current close, private order constraints]
      sources_checked: [yahoo_chart_close_2026_07_10, rgti_q1_2026_10q, smr_q1_2026_10q, aaoi_q1_2026_10q]
      facts_verified: Cash supplies substantial option value and any incremental risk must remain small relative to confirmed account value.
      stale_or_missing_evidence: Broker order preview and next-session executable quote are user-only execution prerequisites.
      confidence: medium_high
      key_findings: Private action, if any, must be one-session, price-capped, and automatically expire; all other buys and all sells are zero.
  unresolved_conflicts: 0
  conflict_resolution: Reviewers disagreed about whether incomplete fixed-price economics permit immediate staging. The main agent reconciled the evidence with a private maximum-loss and expiry rule; current exact terms remain outside this public artifact.

