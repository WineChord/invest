first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Grid-connected power, commissioned AI capacity, high-speed interconnect, launch and spacecraft production, spectrum, licensed isotope enrichment and HALEU, water infrastructure, and validated quantum systems remain plausible constraints.
    inferences: Scarcity is investable only when it converts into durable margin, cash generation and diluted per-share value without excessive financing dependence.
    disconfirming_evidence: Current small and early expressions often capitalize future scarcity before repeatable gross profit, independent validation or free cash flow exists.
    source_ids:
      - completed_close_universe_revalidation_2026_07_27
      - sec_submissions_all_forms_2026_07_27
    investment_implication: Preserve cash until evidence and entry align.
  who_controls_or_removes_scarcity:
    facts: LEU, ASPI, CRDO, ALAB, IREN, VRT, RKLB, ASTS, GILT, MDA, NWPX and RIOT remain direct or partially direct expressions; QXL, JAGU and QUCY do not yet prove control.
    inferences: Direct exposure is insufficient when lenders, customers, regulators, warrants, earnouts or new equity capture most economics.
    disconfirming_evidence: Every current expression retains a valuation, concentration, execution, financing, survival or transaction veto.
    source_ids:
      - qxl_q1_2026_10q
      - jagu_2025_10k
      - qucy_q1_2026_10q
    investment_implication: Keep the lane map and make no promotion.
  who_can_monetize_into_shareholder_value:
    facts: LEU, GILT, MDA, IREN and CRDO remain the next-dollar research queue.
    inferences: Accepted revenue, complete contract economics, repeat orders, cash conversion and survivable capitalization matter more than addressable-market or system claims.
    disconfirming_evidence: Each priority company retains a contract, valuation, concentration, financing, transaction or correlated-exposure veto.
    source_ids:
      - completed_close_universe_revalidation_2026_07_27
      - sec_submissions_all_forms_2026_07_27
    investment_implication: Retain confirmed cash and set every new quantity to zero.
  public_security_expression:
    facts: Fifty-four watchlist securities are tradable, OPENAI and ANTHROPIC are not, and XTND does not yet have a policy-eligible completed listing.
    inferences: A low nominal price, sharp decline, registration filing, IPO or direct thematic label does not create buy eligibility.
    disconfirming_evidence: Many reviewed securities declined sharply, but none cleared the remaining mission, evidence, entry, survival and portfolio gates.
    source_ids:
      - completed_close_universe_revalidation_2026_07_27
      - sec_submissions_all_forms_2026_07_27
    investment_implication: All current new-buy quantities are zero.
  early_small_misunderstood_or_newly_public:
    facts: ASPI, GILT, NWPX, QSI, STDN, ENRD, OCC and XTND retain genuine smaller, early or awkward characteristics; QXL and JAGU were tested as repeated early-stage leads.
    inferences: Early and awkward can support asymmetry only when technical or resource evidence, survival and per-share value capture are credible.
    disconfirming_evidence: QXL lacks independent validation and clean capitalization; JAGU lacks resources and economics; QUCY lacks recurring revenue and stable capitalization; existing priority names retain their own evidence and entry vetoes.
    source_ids:
      - qxl_neutral_atom_claim_2026_05_28
      - jagu_2025_10k
      - qucy_autonomy_platform_2026_06_02
    investment_implication: Continue the current priority queue without a current order.
