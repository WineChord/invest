first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Qualified domestic TRISO and HALEU capacity, energized AI sites, optical links, sovereign quantum systems and deployment capital remain plausible long-duration bottlenecks.
    inferences: Scarcity matters only when qualification, funded demand, protected economics and bounded dilution preserve per-share value.
    disconfirming_evidence: Current leaders remain capital intensive, customer concentrated, richly valued, option-dependent or financing exposed.
    source_ids: [stdn_q2_release_2026_08_26, completed_close_universe_2026_08_26]
    investment_implication: Advance STDN to R2 and the top-three screen without opening an order.
  who_controls_or_removes_scarcity:
    facts: LEU and STDN express nuclear-fuel capacity; IREN and APLD control energized sites; GILT provides satellite-ground infrastructure; quantum and photonics issuers supply other constrained layers.
    inferences: Direct control is stronger than a proxy but must still survive delivery, capex, financing and dilution.
    disconfirming_evidence: No current issuer disclosed a complete incremental project-to-common cash-return bridge.
    source_ids: [stdn_q2_release_2026_08_26]
    investment_implication: LEU, GILT and STDN lead nonholdings; IREN remains the strongest holding-add candidate.
  who_can_monetize_into_shareholder_value:
    facts: STDN has one complete core, IREN one accepted deployment, LEU strategic backlog and GILT current operations; each lacks a decision-grade incremental per-share bridge.
    inferences: Residual common-equity capture after contract, capex and dilution remains the binding constraint.
    disconfirming_evidence: Protected funded contracts, repeat cash conversion or a lower valuation could change the order.
    source_ids: [stdn_q2_release_2026_08_26, completed_close_universe_2026_08_26]
    investment_implication: Cash wins the current next dollar.
  public_security_expression:
    facts: Seventy-one securities have completed closes; three remain unavailable for direct current trading under policy.
    inferences: Observability and eligibility do not establish promotion or buy eligibility.
    disconfirming_evidence: A completed listing plus current filing, valuation and promotion work could change a not-tradable conclusion.
    source_ids: [completed_close_universe_2026_08_26]
    investment_implication: No unavailable price is estimated and no pre-listing name receives quantity.
  early_small_misunderstood_or_newly_public:
    facts: STDN, GILT, APLD, IQMX, ENRD and the open R1/R2 set provide smaller or awkward direct expressions.
    inferences: A smaller denominator enlarges the right tail only when survival, customer economics and dilution-adjusted capture are credible.
    disconfirming_evidence: Contract options, financing, losses, capital stacks and missing unit economics dominate every early challenger today.
    source_ids: [stdn_q2_release_2026_08_26]
    investment_implication: Preserve dated service levels and false-negative triggers without promoting incomplete evidence.
