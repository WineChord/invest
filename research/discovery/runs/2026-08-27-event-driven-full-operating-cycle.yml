first_principles_heading: First-Principles Analysis
first_principles_analysis:
  question_rebuilt_from_basics: Which current public security can turn a scarce bottleneck into exceptional dilution-adjusted per-share value at a feasible weight and beat holdings, cash and all material alternatives now?
  irreducible_facts:
    - Confirmed cash is USD 8783.87 and confirmed holdings are ASTS 11, IREN 5, MDA 9 and RKLB 17.
    - Seventy-one listed securities have a completed August 26 close and the full 74-security universe was reviewed.
    - STDN completed its first commercial reactor core, reported its first quarterly gross profit, raised funded backlog to USD 119.3 million and has approximately USD 239.9 million of pro-forma cash with no debt.
    - STDN's only completed price predates the release, USD 443.5 million of total backlog is customer options and no Q2 filing reconciles contracts or capitalization.
  binding_constraints:
    - Mission, evidence, entry, survival, promotion and opportunity-cost gates must all pass before a nonzero quantity.
    - A stale event price and uncertainty that can reverse residual common-equity value cannot be repaired by symbolic size.
  causal_chain: Scarcity must create funded demand; authorized capacity must deliver; protected economics must create repeat cash above capex and financing; the residual must survive dilution; and a feasible position must improve portfolio outcomes relative to cash and alternatives.
  inherited_assumptions_challenged:
    - Total backlog is contracted revenue.
    - One positive-margin quarter or debt-free cash creates an attractive security entry.
    - High cash weight or a sharp price move requires activity.
  value_capture_or_mission_link: Existing holdings preserve live right tails. STDN materially improves the opportunity set and deserves R2 and top-three attention, but no current security has a complete incremental value bridge.
  disconfirming_evidence: Protected funded LEU economics, clean GILT transaction cash flow, a filed and attractively priced STDN event bridge or positive IREN GAAP project cash returns could reverse zero exposure.
  decision_consequence: Hold all confirmed positions and cash; open no new quantity or executable limit before fresh conjunctive evidence and valuation.
