first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Launch cadence, orbital manufacturing, satellite-to-phone capacity, AI compute capacity, power/cooling infrastructure, interconnect bandwidth, and frontier AI distribution remain plausible bottlenecks.
    inferences: ASTS launch success improves one scarce direct-to-device capacity path, while SPCX Cursor increases the opportunity-cost bar across space and frontier AI lanes.
    disconfirming_evidence: Failed ASTS on-orbit operation, RKLB Neutron setbacks, or SPCX post-IPO evidence of poor shareholder economics would weaken the current ranking.
    source_ids:
      - asts_bluebird_8_10_launch_2026_06_17
      - spcx_cursor_8k_2026_06_16
      - sec_event_filing_index_2026_06_18
    investment_implication: Use only small capped RKLB and ASTS adds; keep SPCX as no-buy watch coverage.
  who_controls_or_removes_scarcity:
    facts: SpaceX controls the strongest public cross-lane platform, RKLB controls a smaller integrated launch and space-systems platform, and ASTS controls a high-risk direct-to-device architecture.
    inferences: RKLB and ASTS remain more asymmetric public common-stock expressions than SPCX at the current market value, but SPCX is now a stronger opportunity-cost comparator.
    disconfirming_evidence: Aggressive Starlink Mobile pricing, ASTS deployment issues, RKLB capital-market dilution, or SPCX valuation compression could change the ranking.
    source_ids:
      - rklb_nasdaq100_2026_06_12
      - asts_bluebird_8_10_launch_2026_06_17
      - spcx_quote_2026_06_18
    investment_implication: Keep existing holdings, avoid sells, and add only within strict private caps.
  who_can_monetize_into_shareholder_value:
    facts: RKLB has meaningful backlog and operating execution evidence; ASTS has improved deployment evidence but remains pre-scale and financing-sensitive; SPCX has the deepest business platform but a very large public-market base.
    inferences: Per-dollar upside remains more plausible in smaller staged RKLB and tiny ASTS exposure than in chasing SPCX immediately after IPO and Cursor news.
    disconfirming_evidence: RKLB or ASTS dilution without de-risking, or SPCX trading down after lockup and first-report clarity, would require a fresh promotion and allocation review.
    source_ids:
      - rklb_quote_2026_06_18
      - asts_quote_2026_06_18
      - spcx_cursor_8k_2026_06_16
    investment_implication: Do not buy SPCX now; preserve residual cash for future evidence or price dislocation.
  public_security_expression:
    facts: RKLB, ASTS, CRDO, ALAB, VRT, SPCX, and other watched names are U.S.-listed common stocks under policy v1.1, while SGOV is only an approved liquidity-reserve candidate after broker checks.
    inferences: Tradability does not equal buy eligibility; rows below active/core status or outside buy-zone require promotion before allocation.
    disconfirming_evidence: Broker inability to trade, fees, settlement restrictions, quote gaps, or new material filings before order entry block execution.
    source_ids:
      - spcx_424b4_2026_06_12
      - rklb_quote_2026_06_18
      - asts_quote_2026_06_18
    investment_implication: The private order set should use limit orders only and remain inside confirmed cash.
  early_small_misunderstood_or_newly_public:
    facts: SPCX is newly public but not small; ASTS and RKLB are smaller, more volatile, and more execution-dependent than mature AI infrastructure names.
    inferences: The mission favors small staged exposure to the still-early public space names over mature large-cap proxies when evidence gates are met.
    disconfirming_evidence: If current public valuations keep outrunning evidence, holding cash becomes the default.
    source_ids:
      - community_triage_2026_06_18
      - asts_bluebird_8_10_launch_2026_06_17
      - spcx_quote_2026_06_18
    investment_implication: Buy only the small private RKLB and ASTS quantities if live limits are respected; otherwise hold cash.

