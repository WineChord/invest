        - community lead queue
        - bottleneck map
        - candidate readiness
        - watchlist
      sources_checked:
        - sec_event_index_full_universe_2026_08_11
        - new_r1_primary_evidence_2026_08_11
      facts_verified: Seven new R1 leads retained; RIOT alone reached R2/watch and no new name entered buy eligibility; APLD remains the strongest existing R1.
      stale_or_missing_evidence: Whole-universe semantic issuer-profile coverage remains incomplete; each open R1 has a dated evidence source and deadline.
      confidence: high
      key_findings: MTSI and LASR lead the new R1 queue; QNT identity was corrected to Quantinuum; all seven retain dated SLAs.
    - role: freshness_filing_review
      reasoning_level: xhigh
      independent_context: true
      completed: true
      inputs_used:
        - August 11 SEC event index
        - material filing bodies
        - August 10 completed-close cutoff
      sources_checked:
        - sec_event_index_full_universe_2026_08_11
        - rklb_q2_2026_10q
        - asts_q2_2026_10q
        - riot_q2_2026_10q_and_lease
      facts_verified: RKLB, ASTS, CRWV, GILT, IONQ, QUBT, RIOT and ONDS material filings were reviewed.
      stale_or_missing_evidence: MDA post-acquisition cash conversion and RIOT permanent financing remain future issuer evidence, not silently assumed current facts.
      confidence: high
      key_findings: Hold RKLB and ASTS; promote RIOT to R2/watch; do not promote CRWV, GILT, IONQ, QUBT or ONDS.
    - role: bull_case
      reasoning_level: xhigh
      independent_context: true
      completed: true
      inputs_used:
        - MDA Q2 evidence
        - August 10 completed close
        - confirmed NAV
        - full opportunity set
      sources_checked:
        - mda_q2_2026_results
        - completed_close_universe_2026_08_10
        - rklb_q2_2026_10q
      facts_verified: MDA Q2 supports the smallest scale-up but not fully underwritten sizing.
      stale_or_missing_evidence: Working-capital reversal and the final acquisition-funded capitalization require later primary evidence.
      confidence: medium_high
      key_findings: Prefer MDA +3 over zero or +5, subject to a one-session price cap.
    - role: bear_case
      reasoning_level: xhigh
      independent_context: true
      completed: true
      inputs_used:
        - MDA cash flow
        - acquisition financing
        - dilution
        - space concentration
        - cross-lane challengers
      sources_checked:
        - mda_q2_2026_results
        - completed_close_universe_2026_08_10
        - new_r1_primary_evidence_2026_08_11
      facts_verified: MDA negative free cash flow and acquisition capitalization remain unresolved.
      stale_or_missing_evidence: Blue Canyon and SatixFy Communication Systems pro-forma leverage and cash conversion are not yet reported.
      confidence: high
      key_findings: Preferred zero narrowly but identified no ruin veto; +3 is the strongest bounded counterfactual.
    - role: valuation_entry
      reasoning_level: xhigh
      independent_context: true
      completed: true
      inputs_used:
        - August 10 adjusted close
        - dilution-aware capitalization
        - MDA acquisition funding
        - current opportunity cost
      sources_checked:
        - completed_close_universe_2026_08_10
        - mda_q2_2026_results
        - rklb_q2_2026_10q
      facts_verified: Latest MDA close was USD 33.41 and RKLB next-dollar economics are weaker.
      stale_or_missing_evidence: The effective order remains conditional on the August 11 session and expires rather than rolling to a later date.
      confidence: high
      key_findings: MDA +3 is entry-feasible; +5 is not; RKLB add zero.
    - role: allocation_risk
      reasoning_level: xhigh
      independent_context: true
      completed: true
      inputs_used:
        - confirmed cash
        - August 10 research NAV
        - current holdings
        - zero versus three versus five MDA shares
      sources_checked:
        - completed_close_universe_2026_08_10
        - mda_q2_2026_results
        - rklb_q2_2026_10q
      facts_verified: MDA +3 raises total space exposure to about 25.1 percent and caps incremental loss near 1.08 percent NAV.
      stale_or_missing_evidence: Future acquisition economics determine whether MDA may scale beyond the starter band; RIOT financing controls its future eligibility.
      confidence: high
      key_findings: MDA +3 ranks above zero and +5; RIOT remains zero pending financing and event-after price.
  unresolved_conflicts: 0
  conflict_resolution: MDA +3 prevailed over the narrow bear preference for zero because the unresolved cash-flow and acquisition issues can be bounded by the smallest staged quantity and one-session limit. RIOT was promoted to watch/R2 but not buy eligibility after additional filing, valuation, bear and opportunity-cost review.
