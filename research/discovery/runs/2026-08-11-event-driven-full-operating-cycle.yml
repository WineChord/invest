first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Spacecraft capacity, energized AI-ready land, high-power optical components, compound-semiconductor inputs, non-China rare earths and quantum fault tolerance remain plausible long-horizon bottlenecks.
    inferences: Common equity captures the scarcity only when project finance, dilution, customer concentration and reinvestment leave durable per-share economics.
    disconfirming_evidence: Several new leads are already large, pre-revenue, acquisition-shaped or financed through complex debt and equity claims.
    source_ids:
      - new_r1_primary_evidence_2026_08_11
      - riot_q2_2026_10q_and_lease
    investment_implication: Scale MDA only at the smallest staged quantity; advance RIOT to R2/watch and keep new R1 names at zero.
  who_controls_or_removes_scarcity:
    facts: MDA owns scaled spacecraft and payload capabilities; RIOT controls energized sites; MTSI, LASR and COHR supply photonics; USAR targets rare-earth processing; QNT develops integrated quantum systems.
    inferences: Control is direct enough for research, but only MDA currently combines scaled operating evidence with starter-level entry discipline.
    disconfirming_evidence: RIOT lacks permanent financing and event-after price; every new R1 retains material capitalization or commercialization blockers.
    source_ids:
      - mda_q2_2026_results
      - riot_q2_2026_10q_and_lease
      - new_r1_primary_evidence_2026_08_11
    investment_implication: MDA remains the next-dollar choice; all new names require R2 or promotion evidence first.
  who_can_monetize_into_shareholder_value:
    facts: MDA reported revenue, bookings and backlog at scale; RIOT has one delivered lease and a new signed 191 MW lease; the R1 set ranges from scaled suppliers to pre-revenue projects.
    inferences: MDA has the best current evidence-to-denominator balance even after negative free cash flow and acquisition uncertainty.
    disconfirming_evidence: MDA still lacks post-acquisition cash conversion; RIOT and the R1 names lack bounded fully diluted returns.
    source_ids:
      - mda_q2_2026_results
      - riot_q2_2026_10q_and_lease
      - new_r1_primary_evidence_2026_08_11
    investment_implication: Use a three-share MDA add rather than five; keep RIOT and all R1 names at zero.
  public_security_expression:
    facts: Sixty-eight listed securities have completed prices; OPENAI and ANTHROPIC are unlisted and XTND is pre-listing.
    inferences: Listing and price availability establish observability, not buy eligibility.
    disconfirming_evidence: Seven new listed leads remain R1 and RIOT remains R2/watch rather than active.
    source_ids:
      - completed_close_universe_2026_08_10
      - new_r1_primary_evidence_2026_08_11
    investment_implication: No unlisted, pre-listing or R1 security receives an order.
  early_small_misunderstood_or_newly_public:
    facts: MDA, GILT, APLD, ONDS, ALMU, SATL, QNT, USAR, KEEL and FRMI are early, awkward, newly listed or incompletely understood expressions.
    inferences: Small or new denominators improve right-tail potential only when survival and dilution-adjusted value capture are credible.
    disconfirming_evidence: Each new lead retains debt, dilution, concentration, pre-revenue, construction or customer blockers.
    source_ids:
      - completed_close_universe_2026_08_10
      - new_r1_primary_evidence_2026_08_11
    investment_implication: Preserve the leads under SLA without using incomplete research as either a buy signal or a whole-portfolio veto.
subagents:
  required_roles:
    - role: discovery_lane_candidate_triage
      reasoning_level: xhigh
      independent_context: true
