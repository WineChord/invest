first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Launch cadence, spacecraft production, defense-space backlog conversion, direct-to-device spectrum and carrier distribution, AI interconnect, AI power, nuclear fuel and licensing, and quantum commercialization remain the current scarce constraints.
    inferences: Space infrastructure and direct-to-device connectivity remain the two lanes most relevant to the first deployment.
    disconfirming_evidence: New same-lane space leads have not yet shown cleaner entry quality than RKLB or ASTS.
    source_ids:
      - sec_company_tickers_exchange_2026_06_02
      - defensescoop_golden_dome_sbi_2026_04_24
      - yahoo_chart_close_2026_06_01
    investment_implication: Do not start from a ticker list; RKLB and ASTS remain outputs of the current bottleneck map.
  who_controls_or_removes_scarcity:
    facts: RKLB controls launch and space-systems execution capacity; ASTS controls a direct-to-device satellite-network path; YSS, FLY, VOYG, and MDA may matter but need more evidence or readiness work.
    inferences: RKLB is still the broadest public space-platform expression; ASTS is still the cleanest direct-to-device convexity expression.
    disconfirming_evidence: FLY, YSS, and VOYG carry short-history, dilution, margin, concentration, and accounting risks.
    source_ids:
      - rklb_q1_2026
      - asts_q1_2026
      - fly_q1_2026_results
      - yss_q1_2026_results
      - voyg_q1_2026_results
    investment_implication: New space candidates improve peer coverage but do not replace the staged starter.
  who_can_monetize_into_shareholder_value:
    facts: RKLB has current revenue, backlog, liquidity, and defense-space contract evidence; ASTS has high potential but still needs launch, regulatory, and commercial proof.
    inferences: RKLB deserves the larger staged position; ASTS deserves only a small optionality sleeve.
    disconfirming_evidence: Both companies remain high-multiple and dilution-sensitive.
    source_ids:
      - rklb_q1_2026
      - asts_q1_2026
      - yahoo_chart_close_2026_06_01
    investment_implication: The simulation favored partial deployment over full deployment, but no order was executed.
  public_security_expression:
    facts: RKLB and ASTS are U.S.-listed common stocks and policy-eligible; SpaceX, OpenAI, and Anthropic remain not tradable under policy.
    inferences: The actionable candidate set is limited to current public securities.
    disconfirming_evidence: Some raw leads may be policy-ineligible, SPAC units, funds, or weak proxies.
    source_ids:
      - sec_company_tickers_exchange_2026_06_02
      - rklb_q1_2026
      - asts_q1_2026
    investment_implication: Avoid private, OTC, fund, or token-like substitutes.
  early_small_misunderstood_or_newly_public:
    facts: YSS, FLY, VOYG, and XNDU add newer public coverage, but each remains unbuyable or watch-only after readiness review.
    inferences: The opportunity set improved but did not create a better buy today.
    disconfirming_evidence: Newly public status alone increases uncertainty and does not prove shareholder-value capture.
    source_ids:
      - yss_ipo_prospectus_2026_01_28
      - fly_s1_offering_2026_05_26
      - voyg_ipo_prospectus_2025_06_10
      - xndu_f1_yorkville_2026_05_22
      - sec_company_tickers_exchange_2026_06_02
    investment_implication: Keep future readiness work active, but do not delay today's staged decision for reachable evidence that already failed buy gates.

