first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: HALEU, energized AI-ready power, high-speed interconnect, launch capacity, spacecraft production, spectrum, quantum fabrication and water-transmission capacity remain plausible bottlenecks.
    inferences: Scarcity matters only when listed common equity can retain pricing and reinvestment economics after funding and dilution.
    disconfirming_evidence: Many public proxies capitalize scarcity before contracts, cash conversion and per-share capture are proved.
    source_ids: [completed_close_universe_2026_07_31, sec_submissions_all_forms_2026_08_01]
    investment_implication: Keep GILT LEU MDA IREN and IONQ as the dated next-dollar queue.
  who_controls_or_removes_scarcity:
    facts: LEU controls the strongest listed U.S. enrichment path, GILT owns satellite-ground capabilities, IREN controls powered sites, and IONQ now owns SkyWater.
    inferences: Asset control is insufficient when counterparties, lenders, integration costs, warrants or repeated issuance capture the economics.
    disconfirming_evidence: LEU fixed-price terms, GILT transaction economics, IREN accepted revenue and IONQ post-close capitalization remain incomplete.
    source_ids: [sec_submissions_all_forms_2026_08_01, ionq_skywater_close_2026_07_31]
    investment_implication: Require the August 5 sign-changing evidence before initiating.
  who_can_monetize_into_shareholder_value:
    facts: GILT has the smallest near-buyable denominator, LEU the strongest mission fit, MDA the most balanced platform, IREN the greatest powered-site option and IONQ the newest integrated strategic path.
    inferences: The best business is not automatically the best dilution-adjusted per-share asymmetry.
    disconfirming_evidence: Each leader retains a target-specific evidence, entry or value-capture blocker.
    source_ids: [completed_close_universe_2026_07_31, sec_submissions_all_forms_2026_08_01, ionq_skywater_close_2026_07_31]
    investment_implication: Compare zero with public-safe mission-relevant starter ranges and expire the wait on August 5.
  public_security_expression:
    facts: Fifty-four current research securities have eligible completed closes; OPENAI and ANTHROPIC are unlisted and XTND is pre-listing.
    inferences: Tradability and nominal price do not establish buy eligibility.
    disconfirming_evidence: VIP remains R1 with insufficient financing, customer and survival evidence.
    source_ids: [completed_close_universe_2026_07_31, sec_submissions_all_forms_2026_08_01]
    investment_implication: No new security enters a current buy zone.
  early_small_misunderstood_or_newly_public:
    facts: GILT NWPX OCC QSI ASPI STDN ENRD VIP and XTND remain small, early, awkward or newly public expressions.
    inferences: A small denominator helps only when survival, directness and shareholder value capture are credible.
    disconfirming_evidence: NWPX lacks proved extreme reinvestment economics and VIP lacks a binding AI customer and stable capitalization.
    source_ids: [sec_submissions_all_forms_2026_08_01]
    investment_implication: Keep GILT nearest to entry and VIP bounded at R1.

