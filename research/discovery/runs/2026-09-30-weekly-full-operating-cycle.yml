first_layer_bottleneck_questions:
  what_could_become_scarce:
    facts: Deployable space communications, domestic enrichment and process heat, energized compute, strategic materials processing and optical interconnect remain plausible bottlenecks.
    inferences: Scarcity becomes investable only with authorization, funded delivery and residual common-share economics.
    disconfirming_evidence: Capital intensity, substitution, customer concentration, senior claims and repeated dilution can prevent physical scarcity from producing shareholder value.
    source_ids: [sec_event_index_targeted_72_2026_09_30, sec_foundational_index_targeted_71_of_72_2026_09_30]
    investment_implication: Preserve existing starters and keep LEU as the leading dated nonholding review without opening a new position.
  who_controls_or_removes_scarcity:
    facts: Operators need qualified assets, licenses, fuel, grid access, customer contracts and manufacturing execution rather than labels alone.
    inferences: Direct control matters only when it can be lawfully operated and economically scaled.
    disconfirming_evidence: A technical layer can be controlled while creditors, customers or capital providers capture most returns.
    source_ids: [sec_event_index_targeted_72_2026_09_30, sec_omitted_forms_2026_09_30]
    investment_implication: Correct capital claims and operating rights before scaling any bottleneck exposure.
  who_can_monetize_into_shareholder_value:
    facts: GILT has an operating business, LEU has customers and funding, and current holdings have distinct right-tail paths; each retains a cash-return or entry gap.
    inferences: Monetization requires recurring cash after capital needs and senior claims rather than contract count alone.
    disconfirming_evidence: Weak unit economics, overruns, integration failure or further dilution can break the per-share chain.
    source_ids: [completed_close_universe_2026_09_29, sec_event_index_targeted_72_2026_09_30]
    investment_implication: Hold current quantities and keep every incremental equity quantity at zero through October 2.
  public_security_expression:
    facts: The deterministic reference includes 7673 eligible securities while paired SEC review intentionally targets 72 listed decision-universe symbols.
    inferences: Listing and observability do not create buy eligibility; targeted SEC coverage is not full-market semantic search.
    disconfirming_evidence: A listed issuer with protected economics, correct claims and a superior entry could displace the present ordering.
    source_ids: [completed_close_universe_2026_09_29, sec_event_index_targeted_72_2026_09_30]
    investment_implication: No current new expression clears promotion and allocation gates.
  early_small_misunderstood_or_newly_public:
    facts: NuCube and WISeSat are transaction-stage leads and REA is a listed exploration option; none has bounded shareholder economics.
    inferences: Small denominators enlarge upside only if technology, funding and diluted value capture survive source review.
    disconfirming_evidence: Prelisting status, unlicensed technology, poor metallurgy, redemptions or destructive financing can dominate the right tail.
    source_ids: [sec_omitted_forms_2026_09_30, public_community_triage_2026_09_30]
    investment_implication: Retain dated R1 work without promotion or purchase.
