    fully_underwritten_weight_range_pct: [6, 12]
    current_stage: starter_held_scale_gate_closed
    adverse_permanent_impairment_pct: 100
    max_nav_impairment_pct: 4
    downside_portfolio_result: Acquisition leverage, integration failure, dilution or weak cash conversion could impair the starter and compound correlated space losses.
    base_portfolio_result: The existing starter can participate in a capable space platform while cash conversion and acquisition economics remain under review.
    upside_portfolio_result: Successful Blue Canyon and CLS integration with strong per-share cash conversion could justify a material platform position.
    exceptional_portfolio_result: A vertically integrated global spacecraft, payload and geospatial-data platform could create rare multi-decade asymmetry.
    contribution_dilution_check: The current starter is mission-relevant; future scaling must use total confirmed liquidity and compare the full RKLB, ASTS and MDA space exposure rather than the latest contribution.
    scale_milestones:
      - post-offering diluted shares and acquisition consideration are fully reconciled
      - pro-forma leverage stays within the stated target and declines through operating cash flow
      - working-capital outflows reverse and combined backlog produces durable free cash flow
    hold_milestones:
      - revenue, bookings, backlog and margins remain consistent with the operating thesis
      - acquisitions close within a survivable capital plan
    reduce_or_exit_milestones:
      - leverage exceeds the stated range without a credible operating-cash-flow path
      - persistent dilution-adjusted cash conversion misses the underwriting case
      - backlog, margin or integration evidence breaks the shareholder-value path
