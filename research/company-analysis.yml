entries:
  - id: 2026-05-26-rklb-initial-baseline
    symbol: RKLB
    analyzed_at: "2026-05-26"
    analysis_type: initial_baseline
    policy_version: v1.0
    title: Initial baseline
    stance: A
    summary: Rocket Lab is the strongest execution-led public space platform in the initial universe, with revenue growth, margin expansion, and backlog evidence supporting a core-candidate role.
    upside_path: Compound from Electron and space systems into a broader launch and space infrastructure platform, with Neutron as the major upside variable.
    risk_watch: Neutron slippage, backlog conversion, space systems margin quality, launch reliability, and dilution discipline.
    next_check: Next earnings or Neutron update.
    source_path: research/2026-05-26-initial-baseline.md
  - id: 2026-05-26-asts-initial-baseline
    symbol: ASTS
    analyzed_at: "2026-05-26"
    analysis_type: initial_baseline
    policy_version: v1.0
    title: Initial baseline
    stance: A
    summary: AST SpaceMobile carries one of the highest-upside theses because direct-to-device satellite broadband could become a new global connectivity layer.
    upside_path: Build a scaled satellite-to-phone network with mobile operator distribution and regulated commercial service.
    risk_watch: Launch cadence, satellite production, regulatory approvals, mobile network operator monetization, burn rate, and dilution.
    next_check: Next launch, regulatory, or commercial update.
    source_path: research/2026-05-26-initial-baseline.md
  - id: 2026-05-26-crdo-initial-baseline
    symbol: CRDO
    analyzed_at: "2026-05-26"
    analysis_type: initial_baseline
    policy_version: v1.0
    title: Initial baseline
    stance: A-
    summary: Credo is a strong AI infrastructure bottleneck candidate through high-speed, energy-efficient connectivity, but concentration and valuation risk require close tracking.
    upside_path: Capture durable AI data-center interconnect demand as scale-up and scale-out network complexity rises.
    risk_watch: Hyperscaler concentration, AI capex cyclicality, margin compression, product diversification, and competing interconnect routes.
    next_check: Next quarterly result or customer concentration disclosure.
    source_path: research/2026-05-26-initial-baseline.md
  - id: 2026-05-26-alab-initial-baseline
    symbol: ALAB
    analyzed_at: "2026-05-26"
    analysis_type: initial_baseline
    policy_version: v1.0
    title: Initial baseline
    stance: A-
    summary: Astera Labs has high-quality exposure to AI rack-scale connectivity, with strong growth and margins but little room for execution mistakes.
    upside_path: Become a key connectivity platform across PCIe, CXL, Ethernet, NVLink Fusion, UALink, and AI fabric transitions.
    risk_watch: AI order slowdown, inventory correction, customer concentration, design-win losses, and gross margin compression.
    next_check: Next quarterly result or design-win update.
    source_path: research/2026-05-26-initial-baseline.md
  - id: 2026-05-26-vrt-initial-baseline
    symbol: VRT
    analyzed_at: "2026-05-26"
    analysis_type: initial_baseline
    policy_version: v1.0
    title: Initial baseline
    stance: A-
    summary: Vertiv is a more mature AI infrastructure candidate that sits on the power, cooling, thermal, and service bottlenecks of data-center buildouts.
    upside_path: Compound through sustained AI data-center power and cooling demand, especially liquid cooling and infrastructure services.
    risk_watch: Data-center order cancellations, margin pressure, liquid-cooling execution, supply constraints, and backlog quality.
    next_check: Next order, backlog, or liquid-cooling update.
    source_path: research/2026-05-26-initial-baseline.md
  - id: 2026-05-26-nbis-initial-baseline
    symbol: NBIS
    analyzed_at: "2026-05-26"
    analysis_type: initial_baseline
    policy_version: v1.0
    title: Initial baseline
    stance: B+
    summary: Nebius can benefit from scarce GPU capacity, power access, and AI factory execution, but financing and utilization quality are central.
    upside_path: Build differentiated AI cloud capacity if GPU supply, power, and customer demand remain constrained.
    risk_watch: Capex intensity, financing dilution, receivables quality, customer concentration, utilization economics, and delivery delays.
    next_check: Next 6-K, customer update, or financing update.
    source_path: research/2026-05-26-initial-baseline.md
  - id: 2026-05-29-mu-watchlist-expansion
    symbol: MU
    analyzed_at: "2026-05-29"
    analysis_type: watchlist_expansion_scan
    policy_version: v1.1
    title: Watchlist expansion scan
    stance: B+
    summary: Micron adds direct AI memory and HBM bottleneck exposure, but memory cyclicality keeps it watch-only until evidence and entry work are refreshed.
    upside_path: Benefit if HBM and advanced DRAM become durable constraints in AI accelerator systems rather than a short commodity cycle.
    risk_watch: Memory pricing cycles, capex intensity, HBM share losses, China exposure, inventory corrections, and margin volatility.
    next_check: Next earnings or HBM supply and margin update.
    source_path: research/2026-05-29-watchlist-expansion-scan.md
  - id: 2026-05-29-crwv-watchlist-expansion
    symbol: CRWV
    analyzed_at: "2026-05-29"
    analysis_type: watchlist_expansion_scan
    policy_version: v1.1
    title: Watchlist expansion scan
    stance: B+
    summary: CoreWeave adds pure-play AI cloud capacity exposure, with clearer neocloud focus than most infrastructure names but high balance-sheet and customer concentration risk.
    upside_path: Compound if scarce GPU capacity, data-center power, and AI workload demand support durable utilization and pricing.
    risk_watch: Debt load, customer concentration, GPU depreciation, hyperscaler competition, supply commitments, and financing dilution.
    next_check: Next earnings, customer concentration disclosure, or debt update.
    source_path: research/2026-05-29-watchlist-expansion-scan.md
  - id: 2026-05-26-crcl-initial-baseline
    symbol: CRCL
    analyzed_at: "2026-05-26"
    analysis_type: initial_baseline
    policy_version: v1.0
    title: Initial baseline
    stance: B+
    summary: Circle is a programmable-money infrastructure candidate whose upside depends on becoming a durable regulated internet-dollar toll point.
    upside_path: Expand USDC circulation, payments utility, and developer ecosystem beyond rate-sensitive reserve income.
    risk_watch: USDC share loss, distribution cost pressure, falling rates, adverse regulation, and banks or exchanges capturing economics.
    next_check: Next reserve, USDC circulation, or earnings update.
    source_path: research/2026-05-26-initial-baseline.md
  - id: 2026-05-26-cbrs-initial-baseline
    symbol: CBRS
    analyzed_at: "2026-05-26"
    analysis_type: initial_baseline
    policy_version: v1.0
    title: Initial baseline
    stance: B
    summary: Cerebras has meaningful AI infrastructure ambition, but its public track record is too short for core status.
    upside_path: Convert wafer-scale AI systems and inference demand into durable revenue after becoming a public company.
    risk_watch: Customer concentration, backlog conversion, gross margin quality, supply chain constraints, and valuation expectations.
    next_check: After at least two public quarterly reports.
    source_path: research/2026-05-26-initial-baseline.md
  - id: 2026-05-29-iren-watchlist-expansion
    symbol: IREN
    analyzed_at: "2026-05-29"
    analysis_type: watchlist_expansion_scan
    policy_version: v1.1
    title: Watchlist expansion scan
    stance: B
    summary: IREN is the only miner and power-site conversion name promoted because it may turn power access into AI cloud optionality without adding the whole crypto-miner basket.
    upside_path: Convert low-cost power and data-center sites into contracted AI compute capacity while retaining optionality from bitcoin mining economics.
    risk_watch: Bitcoin exposure, AI customer quality, financing needs, construction execution, GPU procurement, and dilution.
    next_check: Next AI cloud capacity, customer, or financing update.
    source_path: research/2026-05-29-watchlist-expansion-scan.md
  - id: 2026-05-29-oklo-watchlist-expansion
    symbol: OKLO
    analyzed_at: "2026-05-29"
    analysis_type: watchlist_expansion_scan
    policy_version: v1.1
    title: Watchlist expansion scan
    stance: B
    summary: Oklo adds advanced nuclear optionality for power-constrained AI and industrial demand, but it remains pre-commercial and highly dependent on licensing execution.
    upside_path: Become a deployable advanced-fission power supplier if regulatory approvals, fuel access, and customer commitments converge.
    risk_watch: NRC licensing, project timing, fuel availability, pre-revenue dilution, customer contract quality, and technology execution.
    next_check: Next NRC, licensing, customer, or deployment update.
    source_path: research/2026-05-29-watchlist-expansion-scan.md
  - id: 2026-05-26-be-initial-baseline
