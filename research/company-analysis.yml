entries:
  - id: 2026-06-12-spcx-ipo-readiness
    symbol: SPCX
    analyzed_at: "2026-06-12"
    analysis_type: discovery_readiness
    policy_version: v1.1
    title: Public IPO readiness
    stance: B+
    summary: SpaceX is now a public cross-lane watchlist candidate under SPCX, but first-day valuation and governance keep it outside buy eligibility.
    upside_path: Compound launch, Starlink connectivity, direct-to-device service, AI compute infrastructure, and frontier AI platform economics into an integrated infrastructure platform.
    risk_watch: First-day mega-cap valuation, controlled-company governance, xAI/X losses, stock-funded deal dilution, underwriter option and lockup dynamics, Starship execution, Starlink Mobile competition, and spectrum transaction execution.
    next_check: Post-IPO trading stabilization, underwriter option update, lockup or float update, first public quarterly report, Starship or Starlink Mobile milestone, xAI/X integration update, or thesis-preserving price dislocation.
    source_path: research/filings/2026-06-12-SPCX-424B4-IPO.md
  - id: 2026-05-26-rklb-initial-baseline
    symbol: RKLB
    analyzed_at: "2026-05-26"
    analysis_type: initial_baseline
    policy_version: v1.0
    title: Initial baseline
    stance: A
    summary: Rocket Lab is the strongest execution-led public space platform in the initial universe, with revenue growth, margin expansion, and backlog evidence supporting a core-candidate role.
    upside_path: Compound from Electron and space systems into a broader launch and space infrastructure platform, with Neutron as the major upside variable.
    risk_watch: Neutron slippage, backlog conversion, space systems margin quality, launch reliability, and dilution discipline.
    next_check: Next earnings or Neutron update.
    source_path: research/2026-05-26-initial-baseline.md
  - id: 2026-05-26-asts-initial-baseline
    symbol: ASTS
    analyzed_at: "2026-05-26"
    analysis_type: initial_baseline
    policy_version: v1.0
    title: Initial baseline
    stance: A
    summary: AST SpaceMobile carries one of the highest-upside theses because direct-to-device satellite broadband could become a new global connectivity layer.
    upside_path: Build a scaled satellite-to-phone network with mobile operator distribution and regulated commercial service.
    risk_watch: Launch cadence, satellite production, regulatory approvals, mobile network operator monetization, burn rate, and dilution.
    next_check: Next launch, regulatory, or commercial update.
    source_path: research/2026-05-26-initial-baseline.md
  - id: 2026-05-26-crdo-initial-baseline
    symbol: CRDO
    analyzed_at: "2026-05-26"
    analysis_type: initial_baseline
    policy_version: v1.0
    title: Initial baseline
    stance: A-
    summary: Credo is a strong AI infrastructure bottleneck candidate through high-speed, energy-efficient connectivity, but concentration and valuation risk require close tracking.
    upside_path: Capture durable AI data-center interconnect demand as scale-up and scale-out network complexity rises.
    risk_watch: Hyperscaler concentration, AI capex cyclicality, margin compression, product diversification, and competing interconnect routes.
    next_check: Next quarterly result or customer concentration disclosure.
    source_path: research/2026-05-26-initial-baseline.md
  - id: 2026-05-26-alab-initial-baseline
    symbol: ALAB
    analyzed_at: "2026-05-26"
    analysis_type: initial_baseline
    policy_version: v1.0
    title: Initial baseline
    stance: A-
    summary: Astera Labs has high-quality exposure to AI rack-scale connectivity, with strong growth and margins but little room for execution mistakes.
    upside_path: Become a key connectivity platform across PCIe, CXL, Ethernet, NVLink Fusion, UALink, and AI fabric transitions.
    risk_watch: AI order slowdown, inventory correction, customer concentration, design-win losses, and gross margin compression.
    next_check: Next quarterly result or design-win update.
    source_path: research/2026-05-26-initial-baseline.md
  - id: 2026-05-26-vrt-initial-baseline
    symbol: VRT
    analyzed_at: "2026-05-26"
    analysis_type: initial_baseline
    policy_version: v1.0
    title: Initial baseline
    stance: A-
    summary: Vertiv is a more mature AI infrastructure candidate that sits on the power, cooling, thermal, and service bottlenecks of data-center buildouts.
    upside_path: Compound through sustained AI data-center power and cooling demand, especially liquid cooling and infrastructure services.
    risk_watch: Data-center order cancellations, margin pressure, liquid-cooling execution, supply constraints, and backlog quality.
    next_check: Next order, backlog, or liquid-cooling update.
    source_path: research/2026-05-26-initial-baseline.md
  - id: 2026-05-26-nbis-initial-baseline
    symbol: NBIS
    analyzed_at: "2026-05-26"
    analysis_type: initial_baseline
    policy_version: v1.0
    title: Initial baseline
    stance: B
    summary: Nebius can benefit from scarce GPU capacity, power access, and AI factory execution, but financing and utilization quality are central.
    upside_path: Build differentiated AI cloud capacity if GPU supply, power, and customer demand remain constrained.
    risk_watch: Capex intensity, financing dilution, receivables quality, customer concentration, utilization economics, and delivery delays.
    next_check: Next 6-K, customer update, or financing update.
    source_path: research/2026-05-26-initial-baseline.md
  - id: 2026-05-29-mu-watchlist-expansion
